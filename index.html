<script>
  // Theme before first paint (pref: system | dark | light). Storage can be unavailable; default to system.
  (function () {
    var pref = 'system';
    try { pref = (JSON.parse(localStorage.getItem('fp.prefs.v1') || '{}').theme) || 'system'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'system' && (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>

@font-face{font-family:'Changa';font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/changa-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'Plex Arabic';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Plex Arabic';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Plex Arabic';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --floor:#0f110d; --plate:#171a14; --rail:#20241a; --line:#2b3025; --line-2:#3c4233;
  --chalk:#eef1e6; --chalk-2:#a9b09d; --chalk-3:#7d8472;
  --volt:#c8f135; --volt-ink:#12160a; --volt-text:#c8f135; --volt-soft:rgba(200,241,53,.13);
  --amber:#ffb454; --amber-soft:rgba(255,180,84,.14); --red:#ff7a6b; --red-soft:rgba(255,122,107,.15);
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --body:'Plex Arabic','SF Arabic','Segoe UI',Tahoma,sans-serif;
  --display:'Changa','Plex Arabic','SF Arabic',sans-serif;
  --tabs-h:62px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --floor:#f1f2ec; --plate:#ffffff; --rail:#f4f5ef; --line:#dde0d4; --line-2:#c6cbba;
  --chalk:#15180f; --chalk-2:#4b5142; --chalk-3:#6c7262;
  --volt:#c8f135; --volt-ink:#12160a; --volt-text:#4a6500; --volt-soft:rgba(130,170,0,.15);
  --amber:#8f5300; --amber-soft:rgba(230,150,40,.16); --red:#b3342a; --red-soft:rgba(200,60,50,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--floor);color:var(--chalk);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--volt-text)}
:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--chalk-2)}
.small{font-size:13px}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(var(--tabs-h) + 96px + env(safe-area-inset-bottom))}

/* top bar */
.top{display:flex;align-items:center;gap:8px;min-height:44px}
.datenav{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.datenav .d{background:none;border:0;padding:6px 4px;font:600 16px/1.2 var(--body);color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--plate);color:var(--chalk);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.sync{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--plate);color:var(--chalk-2);font:600 13px/1 var(--body);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--chalk-3);flex:0 0 8px}
.sync.ok i{background:var(--volt)} .sync.pending i,.sync.offline i{background:var(--amber)} .sync.error i{background:var(--red)}
.sync.syncing i{background:var(--volt);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* hero */
.hero{padding:14px 0 6px}
.hero .kicker{font:600 14px/1.3 var(--body);color:var(--chalk-2);margin:0}
.hero h1{font:700 clamp(44px,13vw,60px)/1.02 var(--display);margin:2px 0 6px;letter-spacing:0}
.hero .sub{margin:0;color:var(--chalk-2)}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:18px}
.weeks i{height:6px;border-radius:3px;background:var(--line)}
.weeks i.past{background:var(--chalk-3)}
.weeks i.now{background:linear-gradient(to left,var(--volt) var(--p,50%),var(--line-2) var(--p,50%))}
.weekline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--chalk-2);margin-top:7px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{position:relative;height:58px;border-radius:14px;border:1px solid var(--line);background:var(--plate);color:var(--chalk-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:600 11px/1.2 var(--body);padding:0}
.day b{font:600 19px/1 var(--display);color:var(--chalk)}
.day.rest b{color:var(--chalk-2)}
.day.sel{border-color:var(--volt);box-shadow:inset 0 0 0 1px var(--volt)}
.day .marks{display:flex;gap:3px;height:6px;margin-top:3px}
.day .marks u{display:block;width:6px;height:6px;border-radius:50%;background:var(--volt);text-decoration:none}
.day .marks u.t{width:12px;border-radius:3px}
.day.out{opacity:.45}
.go{margin-top:16px}

/* events */
.events{display:grid;gap:8px;margin-top:16px}
.event{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--rail);border:1px solid var(--line)}
.event .dot{width:10px;height:10px;border-radius:50%;background:var(--chalk-3);margin-top:8px;flex:0 0 10px}
.event.inbody .dot,.event.review .dot{background:var(--volt)}
.event.photos .dot,.event.test .dot{background:var(--amber)}
.event b{display:block;font-weight:600}
.event span{display:block;font-size:14px;color:var(--chalk-2)}

/* blocks and fields */
.block{margin-top:30px}
.block>h2{font:700 22px/1.2 var(--display);margin:0 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.block>h2 small{font:400 13px/1.3 var(--body);color:var(--chalk-2)}
.panel{background:var(--plate);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.span2{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;background:var(--plate);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px 9px;min-width:0}
.field:focus-within{border-color:var(--volt)}
.field label{font-size:13px;color:var(--chalk-2);line-height:1.3}
.field .val{display:flex;align-items:baseline;gap:6px;min-width:0}
.field input{border:0;outline:0;background:transparent;padding:0;margin:0;font:600 26px/1.15 var(--display);color:var(--chalk);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--line-2);opacity:1}
.field .unit{color:var(--chalk-3);font-size:13px;white-space:nowrap}
.field .fhint{font-size:12px;color:var(--chalk-3);line-height:1.4}
.field .fhint.good{color:var(--volt-text)}
.field.hero-field input{font-size:46px}
.field.err{border-color:var(--red)}
.field .errmsg{font-size:12px;color:var(--red)}
.qline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.qline:first-child{border-top:0;padding-top:2px}
.qline .q{font-weight:600}
.qline .q small{display:block;font-weight:400;color:var(--chalk-2);font-size:13px}
textarea{width:100%;min-height:92px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--plate);padding:12px;resize:vertical;line-height:1.5}
textarea:focus{outline:0;border-color:var(--volt)}

/* chips and toggles */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scale{display:grid;gap:6px}
.scale.s5{grid-template-columns:repeat(5,1fr)}
.scale.s11{grid-template-columns:repeat(11,1fr);gap:4px}
.chip{min-height:42px;min-width:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--chalk);font:600 15px/1 var(--body)}
.scale .chip{padding:0;border-radius:12px;font-family:var(--display);font-size:17px}
.scale.s11 .chip{min-width:0;min-height:40px;font-size:15px;border-radius:10px}
.chip[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.chip.warn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1a1205}
.chip.stop[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#1b0806}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--chalk-3);margin-top:5px}
.tog{width:52px;height:32px;border-radius:999px;border:1px solid var(--line-2);background:var(--rail);position:relative;flex:0 0 52px;padding:0}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--chalk-3);transition:inset-inline-start .15s}
.tog[aria-pressed="true"]{background:var(--volt);border-color:var(--volt)}
.tog[aria-pressed="true"]::after{inset-inline-start:23px;background:var(--volt-ink)}
@media (prefers-reduced-motion:reduce){.tog::after{transition:none}}

/* meals */
.window{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--rail);border:1px solid var(--line);margin-bottom:6px}
.window .st{font:700 15px var(--body)}
.window .st.open{color:var(--volt-text)}
.window span{color:var(--chalk-2);font-size:14px}
.meal{display:grid;grid-template-columns:56px 1fr 48px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.meal .t{font:600 16px/1.2 var(--display);color:var(--chalk-2)}
.meal .t small{display:block;font:400 12px var(--body);color:var(--chalk-3)}
.meal .nm{font-weight:600;line-height:1.35}
.meal .mac{font-size:13px;color:var(--chalk-2)}
.meal .mex{font-size:13px;color:var(--chalk-3);line-height:1.5;margin-top:3px}
.meal .kc{font:500 13px var(--body);color:var(--chalk-2);margin-inline-start:6px;white-space:nowrap}
.tick{width:46px;height:46px;border-radius:50%;border:2px solid var(--line-2);background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.tick svg{width:22px;height:22px}
.tick[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.totals{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--chalk-2);padding-top:10px}

/* water stepper */
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line-2);background:var(--rail);font:600 22px/1 var(--display)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--volt);width:var(--w,0%)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;border:0;font:700 17px/1 var(--body);padding:0 22px;width:100%;text-decoration:none}
.btn-primary{background:var(--volt);color:var(--volt-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line-2);color:var(--chalk)}
.btn-quiet{background:var(--rail);color:var(--chalk);border:1px solid var(--line)}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn.sm{height:42px;font-size:15px;border-radius:12px;padding:0 14px;width:auto}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}

/* save bar */
.savebar{position:fixed;inset-inline:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom));z-index:25;padding:14px 16px 10px;background:linear-gradient(to top,var(--floor) 72%,rgba(0,0,0,0))}
.savebar .in{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:12px}
.savebar .state{flex:1;font-size:13px;line-height:1.35;color:var(--chalk-2)}
.savebar .state b{color:var(--chalk);font-weight:600}
.savebar .btn{width:auto;min-width:148px}
.savebar.clean .btn{background:var(--rail);color:var(--chalk-2);border:1px solid var(--line)}

/* tabs */
#tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--floor);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{position:relative;height:var(--tabs-h);background:none;border:0;color:var(--chalk-3);font:600 12px/1 var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#tabs button svg{width:22px;height:22px}
#tabs button[aria-current="page"]{color:var(--chalk)}
#tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--volt)}

/* workout */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.seg::-webkit-scrollbar{display:none}
.seg .chip{flex:0 0 auto}
.seg .chip.today{border-color:var(--volt)}
.timerline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--rail);border:1px solid var(--line)}
.timerline .el{font:700 26px/1 var(--display)}
.rirbox{margin-top:12px;font-size:14px;color:var(--chalk-2)}
.rirbox b{color:var(--volt-text)}
details.fold{border:1px solid var(--line);border-radius:var(--r-md);background:var(--plate);margin-top:14px}
details.fold>summary{list-style:none;cursor:pointer;padding:14px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font:600 20px/1 var(--display);color:var(--chalk-3)}
details.fold[open]>summary::after{content:"−"}
details.fold .body{padding:0 14px 14px;color:var(--chalk-2);font-size:15px}
details.fold ul{margin:0;padding-inline-start:20px}
.ex{padding:20px 0 6px;border-top:1px solid var(--line);margin-top:18px}
.ex:first-of-type{margin-top:22px}
.ex .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex h3{font:700 21px/1.25 var(--display);margin:0}
.ex .en{display:block;font-size:13px;color:var(--chalk-3);direction:ltr;unicode-bidi:isolate;text-align:right}
.ex .ord{font:700 15px/1 var(--display);color:var(--chalk-3);padding-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{font:600 13px/1 var(--body);padding:7px 10px;border-radius:9px;background:var(--rail);color:var(--chalk-2);border:1px solid var(--line)}
.tag.rir{background:var(--volt-soft);color:var(--volt-text);border-color:transparent}
.tag.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
button.tag{cursor:pointer}
button.tag[aria-pressed="true"]{background:var(--chalk);color:var(--floor);border-color:var(--chalk)}
.last{font-size:14px;color:var(--chalk-2);margin-top:10px}
.last b{color:var(--chalk);font-family:var(--display);font-weight:600}
.hint{font-size:14px;line-height:1.45;padding:9px 12px;border-radius:12px;background:var(--rail);color:var(--chalk-2);margin-top:8px}
.hint.up{background:var(--volt-soft);color:var(--volt-text)}
.hint.low{background:var(--amber-soft);color:var(--amber)}
.hint.stop{background:var(--red-soft);color:var(--red)}
.sets{margin-top:14px;display:grid;gap:8px}
.sethead,.set{display:grid;grid-template-columns:26px minmax(0,1.25fr) minmax(0,1fr) minmax(0,.8fr) 54px;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--chalk-3);text-align:center}
.set .n{font:600 17px/1 var(--display);color:var(--chalk-3);text-align:center}
.set input{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--plate);color:var(--chalk);font:600 21px/1 var(--display);text-align:center;width:100%;min-width:0;padding:0 4px;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--chalk-3);opacity:.85}
.set input:focus{outline:0;border-color:var(--volt)}
.set .ok{height:50px;border-radius:13px;border:1px solid var(--line-2);background:transparent;color:var(--chalk-2);display:grid;place-items:center;padding:0}
.set .ok svg{width:22px;height:22px}
.set.done .ok{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.set.done input{background:var(--rail);border-color:transparent}
.set.dirty .ok{border-color:var(--volt);color:var(--volt-text)}
.setbtns{display:flex;gap:8px;margin-top:10px}
.cue{font-size:14px;color:var(--chalk-2);margin-top:10px;line-height:1.5}

/* rest timer */
#restbar{position:fixed;inset-inline:12px;bottom:calc(var(--tabs-h) + 12px + env(safe-area-inset-bottom));z-index:40;max-width:536px;margin:0 auto;background:var(--chalk);color:var(--floor);border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
#restbar .lbl{flex:1;font-size:13px;line-height:1.3;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#restbar .lbl b{display:block;font-size:14px}
#restbar .t{font:700 34px/1 var(--display);min-width:88px;text-align:center;font-variant-numeric:tabular-nums}
#restbar button{height:42px;min-width:46px;border-radius:12px;border:1px solid rgba(0,0,0,.18);background:transparent;color:inherit;font:700 14px/1 var(--body);padding:0 10px}
#restbar.done{background:var(--volt);color:var(--volt-ink)}
body.has-savebar #restbar{bottom:calc(var(--tabs-h) + 88px + env(safe-area-inset-bottom))}

/* toast */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);inset-inline:16px;max-width:528px;margin:0 auto;z-index:60;background:var(--chalk);color:var(--floor);border-radius:16px;padding:13px 16px;font-weight:600;line-height:1.45;transform:translateY(-160%);transition:transform .22s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{transform:none}
#toast.bad{background:var(--red);color:#fff}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* progress */
.stat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stat .big{font:700 64px/1 var(--display);font-variant-numeric:tabular-nums}
.stat .u{color:var(--chalk-2)}
.delta{font:600 16px/1 var(--display);padding:6px 10px;border-radius:10px;background:var(--rail)}
.delta.good{background:var(--volt-soft);color:var(--volt-text)}
.delta.bad{background:var(--amber-soft);color:var(--amber)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font:500 11px var(--body);fill:var(--chalk-3)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--chalk-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--volt);vertical-align:middle;margin-inline-end:6px}
.legend i.dot{width:7px;height:7px;border-radius:50%;background:var(--chalk-3)}
.legend i.dash{background:repeating-linear-gradient(to left,var(--chalk-2) 0 4px,transparent 4px 7px)}
.legend i.band{height:10px;background:var(--volt-soft)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:600 12px var(--body);color:var(--chalk-3);text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:start;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.t{font-family:var(--body)}
.tbl tr.cur td{background:var(--volt-soft)}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.decision{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;background:var(--plate)}
.decision h3{font:700 19px/1.3 var(--display);margin:0 0 6px}
.decision .act{font-weight:600;font-size:17px;margin:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:10px}
.kv dt{color:var(--chalk-2)} .kv dd{margin:0;font-family:var(--display);font-variant-numeric:tabular-nums}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.timeline li .dt{font:600 15px var(--display);color:var(--chalk-2)}
.timeline li.past{opacity:.55}
.timeline li.next .dt{color:var(--volt-text)}
.lifts li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lifts{list-style:none;margin:0;padding:0}
.lifts .v{font-family:var(--display);white-space:nowrap}

/* plan reader */
.toc{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:0 0 auto;text-decoration:none;color:var(--chalk);border:1px solid var(--line-2);border-radius:999px;padding:9px 14px;font:600 14px/1 var(--body)}
.md{font-size:15.5px;line-height:1.75}
.md section{border-top:1px solid var(--line);padding-top:6px;margin-top:18px;scroll-margin-top:12px}
.md h2{font:700 24px/1.3 var(--display);margin:12px 0 8px}
.md h3{font:700 18px/1.35 var(--display);margin:20px 0 6px}
.md p{margin:8px 0}
.md ul,.md ol{padding-inline-start:22px;margin:8px 0}
.md li{margin:4px 0}
.md .tw{overflow-x:auto;margin:10px -16px;padding:0 16px}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th{font-weight:600;color:var(--chalk-2);text-align:start;padding:8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.md td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.md strong{font-weight:600;color:var(--chalk)}
.md .cb{display:inline-block;width:14px;height:14px;border:1.5px solid var(--chalk-3);border-radius:4px;vertical-align:-2px;margin-inline-end:6px}

/* screens */
.center{min-height:calc(100vh - 160px);display:flex;flex-direction:column;justify-content:center}
.brand{font:800 46px/1 var(--display);margin:0}
.brand-sub{color:var(--chalk-2);margin:10px 0 26px}
.stack{display:grid;gap:12px}
.formerr{color:var(--red);font-size:14px;min-height:20px}
.note{font-size:13px;color:var(--chalk-3);line-height:1.6;margin-top:18px}
.list{list-style:none;padding:0;margin:0}
.list li{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.list li .k{font-weight:600}
.list li .k small{display:block;font-weight:400;color:var(--chalk-2);font-size:13px}
.skeleton{height:18px;border-radius:8px;background:var(--rail);margin:10px 0}
</style>
</head>
<body>
<div id="app"><div class="center"><p class="brand">خطة اللياقة</p><p class="brand-sub">جارٍ التحميل…</p></div></div>
<div id="savebar" class="savebar clean" hidden></div>
<div id="restbar" hidden></div>
<nav id="tabs" aria-label="الأقسام" hidden><div class="in"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">هذا التطبيق يحتاج تفعيل JavaScript.</p></noscript>
<script src="config.js?v=1"></script>
<script src="vendor/supabase-2.117.2.js"></script>
<script src="logic.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
