<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c09">
<title>Mohanad 4-Week Plan | BUILD YOUR BEST SELF</title>
<style>
/* ===== Theme: IRONCORE dark + volt green — from reference image ===== */
:root{
  --bg1:#0b0c09; --bg2:#121410; --card:#161814; --card2:#1b1e19; --ink:#f2f4ec; --ink2:#9aa091;
  --line:#272b23; --soft:#1e211b; --dark:#c8f135; --dark2:#20241d;
  --volt:#c8f135; --voltink:#10130a; --voltdim:#8fae26;
  --ok:#c8f135; --okbg:#222a12; --warn:#ffb454; --warnbg:#2a2113; --bad:#ff6f61; --badbg:#2b1512;
  --acc:#c8f135; --accink:#10130a; --r:18px; --shadow:0 12px 30px rgba(0,0,0,.5);
  --sesink:#ffffff; --sesink2:#aeb2a4; --sesink3:#8b9097; --sesline:rgba(255,255,255,.07);
  --herobg1:#181b14; --herobg2:#0f110c; --heroline:rgba(200,241,53,.28); --heroink:#c8ccd2; --heronote:rgba(255,255,255,.08); --heronoteink:#dfe2e6;
  --chartaxis:#2a2e26; --charttxt:#89907f;
  --font:'SF Arabic','Segoe UI','Helvetica Neue',Tahoma,'Noto Naskh Arabic UI',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--font); color:var(--ink); background:var(--bg1);
  min-height:100vh; font-size:15.5px; line-height:1.55;
}
body::before{ /* volt glow like the reference hero */
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(600px 300px at 85% -5%, rgba(200,241,53,.10), transparent 60%),
    radial-gradient(500px 320px at -10% 30%, rgba(200,241,53,.05), transparent 60%),
    linear-gradient(165deg,var(--bg2),var(--bg1) 60%);
}
#app{max-width:980px; margin:0 auto; padding:14px 14px 90px}
/* ===== Typography ===== */
h1,h2,h3{margin:.2em 0 .35em; line-height:1.25}
.display{
  font-weight:900; letter-spacing:.5px; text-transform:uppercase;
  font-size:clamp(26px,6vw,40px); color:var(--ink);
}
.display .ghost{color:var(--volt); text-shadow:0 0 24px rgba(200,241,53,.35)}
.en-tag{ /* volt eyebrow label like STRONGER EVERYDAY */
  display:inline-block; direction:ltr; font-weight:800; letter-spacing:3px; font-size:11px;
  text-transform:uppercase; color:var(--volt);
}
.sub{color:var(--ink2); font-size:13.5px}
/* ===== Header ===== */
header.top{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 10px}
.brand{display:flex; flex-direction:column; gap:2px}
.brand b{font-size:19px; font-weight:900; color:var(--ink)}
.savebox{display:flex; align-items:center; gap:8px}
.savedot{font-size:11px; color:var(--ink2); direction:ltr}
/* ===== Cards ===== */
.card{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; margin:12px 0; border:1px solid var(--line)}
.card.flat{box-shadow:none; border:1px solid var(--line)}
.card h2{font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px; color:var(--ink)}
.card h3{font-size:15.5px; font-weight:800; color:var(--ink)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
@media(max-width:560px){.grid4{grid-template-columns:repeat(2,1fr)} .grid3{grid-template-columns:1fr 1fr}}
/* ===== Buttons ===== */
.btn{
  appearance:none; border:0; cursor:pointer; font-family:inherit; font-weight:800; font-size:15px;
  border-radius:14px; padding:12px 18px; background:var(--soft); color:var(--ink);
  transition:transform .06s ease, box-shadow .15s ease, background .15s, filter .15s; user-select:none;
  border:1px solid var(--line);
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--volt); color:var(--voltink); border-color:var(--volt); box-shadow:0 8px 24px rgba(200,241,53,.25)}
.btn.primary:active{filter:brightness(.92)}
.btn.big{width:100%; padding:16px; font-size:18px; border-radius:16px}
.btn.ok{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
.btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink2)}
.btn.danger{background:var(--badbg); color:var(--bad); border-color:#3a201c}
.btn.small{padding:7px 12px; font-size:13px; border-radius:10px}
.btn[disabled]{opacity:.45; pointer-events:none}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
/* ===== Chips / badges ===== */
.chip{display:inline-flex; align-items:center; gap:5px; background:var(--soft); border:1px solid var(--line); border-radius:99px; padding:3px 10px; font-size:12px; font-weight:700; color:var(--ink2)}
.chip.dark{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
.chip.ok{background:var(--okbg); color:var(--volt); border-color:transparent}
.chip.warn{background:var(--warnbg); color:var(--warn); border-color:transparent}
.chip.spicy{background:#2b1512; color:#ff8a7a; border-color:transparent}
.tg{background:var(--volt); color:var(--voltink); font-size:10.5px; letter-spacing:.8px; direction:ltr; border-radius:6px; padding:2px 7px; font-weight:900; display:inline-block}
/* ===== Nav (bottom) ===== */
nav.tabs{
  position:fixed; bottom:0; right:0; left:0; z-index:50; display:flex; justify-content:space-around;
  background:rgba(14,16,12,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button{
  flex:1; max-width:120px; border:0; background:none; font-family:inherit; cursor:pointer; padding:6px 2px;
  display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink2); font-size:11px; font-weight:800; border-radius:12px;
}
nav.tabs button .ic{font-size:19px; line-height:1; filter:grayscale(.4)}
nav.tabs button.active{color:var(--volt)}
nav.tabs button.active .ic{transform:translateY(-1px); filter:none}
nav.tabs button.active::after{content:""; width:18px; height:3px; border-radius:3px; background:var(--volt); margin-top:1px}
/* ===== Sections ===== */
.view{display:none; animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
/* ===== Stats tiles ===== */
.tile{background:var(--card2); border-radius:14px; padding:10px 12px; border:1px solid var(--line); text-align:center}
.tile .v{font-size:20px; font-weight:900; direction:ltr; color:var(--volt)}
.tile .l{font-size:11px; color:var(--ink2); font-weight:700}
/* ===== Exercise rows ===== */
.exrow{border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:8px 0; background:var(--card2)}
.exrow .t{display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer}
.exrow .t b{font-size:14.5px; color:var(--ink)}
.exrow .meta{font-size:12.5px; color:var(--ink2); margin-top:2px}
.exrow .body{display:none; border-top:1px dashed var(--line); margin-top:9px; padding-top:9px; font-size:13.5px}
.exrow.open{border-color:rgba(200,241,53,.35)}
.exrow.open .body{display:block}
.done-x{color:var(--volt); font-weight:900}
/* ===== Tables ===== */
table.mini{width:100%; border-collapse:collapse; font-size:13px}
table.mini th{font-size:11.5px; color:var(--ink2); font-weight:800; padding:5px 6px; border-bottom:1px solid var(--line); text-align:start}
table.mini td{padding:6px; border-bottom:1px solid var(--soft); text-align:start; color:var(--ink)}
table.mini td.num{direction:ltr; text-align:start; font-weight:700; color:var(--ink)}
/* ===== Inputs ===== */
input[type=number],input[type=text],input[type=date],select,textarea{
  width:100%; font-family:inherit; font-size:15px; padding:10px 12px; border:1.5px solid var(--line);
  border-radius:12px; background:var(--card2); color:var(--ink); outline:none; color-scheme:dark;
}
input:focus,select:focus,textarea:focus{border-color:var(--volt)}
input::placeholder{color:#666c60}
label.f{display:block; font-size:12.5px; font-weight:800; color:var(--ink2); margin:8px 0 4px}
.inrow{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.inrow3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
/* toggle */
.tgl{position:relative; width:46px; height:26px; flex:none}
.tgl input{opacity:0; width:0; height:0}
.tgl span{position:absolute; inset:0; background:#2b2f27; border-radius:99px; transition:.18s; cursor:pointer}
.tgl span::before{content:""; position:absolute; width:20px; height:20px; border-radius:50%; background:#e8ebe0; top:3px; right:3px; transition:.18s; box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tgl input:checked + span{background:var(--volt)}
.tgl input:checked + span::before{transform:translateX(-20px); background:var(--voltink)}
.setline{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--soft); color:var(--ink)}
/* ===== Session (workout mode) ===== */
#sessionOverlay{
  position:fixed; inset:0; z-index:100; color:#fff;
  background:
    radial-gradient(500px 260px at 90% -4%, rgba(200,241,53,.12), transparent 60%),
    linear-gradient(165deg,#101208,#0a0b08 60%);
  display:none; flex-direction:column; overflow-y:auto; padding:14px 14px 26px;
}
#sessionOverlay.on{display:flex}
#sessionOverlay .shead{display:flex; justify-content:space-between; align-items:center; gap:8px}
#sessionOverlay .stime{direction:ltr; font-weight:900; font-size:15px; color:var(--acc)}
.scard{background:rgba(255,255,255,.05); border:1px solid rgba(200,241,53,.16); border-radius:16px; padding:14px; margin:10px 0}
.scard h3{color:var(--sesink)}
.snum{direction:ltr; font-weight:900}
.bigtimer{
  text-align:center; font-weight:900; font-size:64px; direction:ltr; letter-spacing:2px; line-height:1;
  font-variant-numeric:tabular-nums; margin:4px 0;
}
.resting .bigtimer{color:var(--volt); text-shadow:0 0 30px rgba(200,241,53,.35)}
.restdone{animation:pulse .6s ease 4}
@keyframes pulse{0%,100%{background:rgba(200,241,53,.08)}50%{background:rgba(200,241,53,.35)}}
.sbtn{background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18)}
.sbtn.primary{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
.sgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
.sgrid .f{color:#aeb2a4}
#sessionOverlay input{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.2); color:#fff; text-align:center; direction:ltr; font-weight:800}
.setdots{display:flex; gap:6px; margin:6px 0}
.setdots i{width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.18)}
.setdots i.d{background:var(--volt)}
.setdots i.cur{outline:2px solid #fff; outline-offset:2px}
/* ===== Meals ===== */
.meal{border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:8px 0; background:var(--card2)}
.meal b{color:var(--ink)}
.meal .mt{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
.meal .macro{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.mtag{font-size:11px; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:2px 8px; font-weight:800; color:var(--ink2); direction:ltr}
.mtag.w{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
/* ===== Calendar ===== */
.wkband{display:flex; gap:6px; overflow-x:auto; padding:4px 0; scrollbar-width:none}
.wkband::-webkit-scrollbar{display:none}
.dayb{flex:none; width:64px; border:1.5px solid var(--line); background:var(--card2); border-radius:14px; padding:8px 4px; text-align:center; cursor:pointer; font-family:inherit; color:var(--ink)}
.dayb small{display:block; font-size:10px; color:var(--ink2); font-weight:700}
.dayb b{font-size:15px}
.dayb.today{border-color:var(--volt); box-shadow:0 0 14px rgba(200,241,53,.22)}
.dayb.selected{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
.dayb.selected small{color:#3c4517}
.dayb .st{font-size:10px; font-weight:800}
.dayb .st.done{color:var(--volt)}
.dayb.selected .st.done{color:var(--voltink)}
/* ===== Progress charts ===== */
.chartbox{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:10px}
svg.chart{width:100%; height:150px; display:block; direction:ltr}
/* ===== Misc ===== */
.hr{height:1px; background:var(--line); margin:12px 0}
.note{font-size:12.5px; color:var(--ink2); background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-top:8px}
.warnnote{font-size:12.5px; color:var(--warn); background:var(--warnbg); border:1px solid #3a2c14; border-radius:10px; padding:8px 10px; margin-top:8px}
.okline{color:var(--volt); font-weight:800}
a.ext{color:var(--volt); font-weight:800; text-decoration:underline; text-underline-offset:3px}
.center{text-align:center}
.mut{color:var(--ink2)}
.spacer{height:8px}
.progressbar{height:8px; background:var(--soft); border-radius:99px; overflow:hidden}
.progressbar i{display:block; height:100%; background:var(--volt); border-radius:99px; transition:width .3s}
.progressbar.g i{background:var(--volt)}
dialog{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:18px; padding:0; max-width:480px; width:92vw; box-shadow:0 24px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,6,4,.65); backdrop-filter:blur(3px)}
.dlgin{padding:18px}
.toast{
  position:fixed; bottom:84px; right:50%; transform:translateX(50%); background:var(--volt); color:var(--voltink);
  padding:10px 18px; border-radius:99px; font-weight:800; font-size:13.5px; z-index:200; box-shadow:0 10px 28px rgba(200,241,53,.3);
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.toast.on{opacity:1}
.offlinebanner{background:var(--warnbg); color:var(--warn); font-size:12.5px; font-weight:700; border-radius:12px; padding:8px 12px; margin:8px 0; display:none}

/* ===== Light "morning" theme: white + energetic light blue ===== */
html[data-theme='light'] body{background:var(--bg1)}
html[data-theme='light']{
  --bg1:#eef2f7; --bg2:#f7f9fc; --card:#ffffff; --card2:#f6f9fc; --ink:#12233a; --ink2:#5b6b7e;
  --line:#dde5ee; --soft:#eaf1f8; --dark:#1e9bff; --dark2:#e3edf7;
  --volt:#1e9bff; --voltink:#ffffff; --voltdim:#1478c8;
  --ok:#1e9bff; --okbg:#e3f1ff; --warn:#b45309; --warnbg:#fdf1e0; --bad:#c0392b; --badbg:#fdecea;
  --acc:#1e9bff; --accink:#ffffff; --shadow:0 10px 26px rgba(30,80,140,.12);
  --sesink:#12233a; --sesink2:#5b6b7e; --sesink3:#7b8a9c; --sesline:rgba(18,35,58,.08);
  --herobg1:#ffffff; --herobg2:#f2f7fd; --heroline:rgba(30,155,255,.35); --heroink:#5b6b7e; --heronote:rgba(30,155,255,.08); --heronoteink:#31577e;
  --chartaxis:#dde5ee; --charttxt:#7b8a9c;
}
html[data-theme='light'] body::before{
  background:
    radial-gradient(600px 300px at 85% -5%, rgba(30,155,255,.10), transparent 60%),
    radial-gradient(500px 320px at -10% 30%, rgba(30,155,255,.06), transparent 60%),
    linear-gradient(165deg,var(--bg2),var(--bg1) 60%);
}
html[data-theme='light'] .display .ghost{color:var(--acc); text-shadow:0 0 24px rgba(30,155,255,.3)}
html[data-theme='light'] nav.tabs{background:rgba(255,255,255,.92)}
html[data-theme='light'] #sessionOverlay{
  background:
    radial-gradient(500px 260px at 90% -4%, rgba(30,155,255,.10), transparent 60%),
    linear-gradient(165deg,#f4f8fd,#e9f0f8 60%);
  color:var(--ink);
}
html[data-theme='light'] .scard{background:#ffffff; border:1px solid rgba(30,155,255,.22); box-shadow:0 8px 22px rgba(30,80,140,.08)}
html[data-theme='light'] .scard h3{color:var(--ink)}
html[data-theme='light'] #sessionOverlay input{background:#fff; border-color:var(--line); color:var(--ink)}
html[data-theme='light'] .sbtn{background:#eaf1f8; color:var(--ink); border:1px solid var(--line)}
html[data-theme='light'] .sbtn.primary{background:var(--acc); color:#fff; border-color:var(--acc)}
html[data-theme='light'] .setdots i{background:rgba(18,35,58,.15)}
html[data-theme='light'] .resting .bigtimer{color:var(--acc); text-shadow:0 0 24px rgba(30,155,255,.35)}
html[data-theme='light'] input,html[data-theme='light'] select,html[data-theme='light'] textarea{color-scheme:light}
html[data-theme='light'] .chip.spicy{background:#fdecea;color:#c0392b}
html[data-theme='light'] .exrow.open{border-color:rgba(30,155,255,.4)}
html[data-theme='light'] .btn.primary{box-shadow:0 8px 22px rgba(30,155,255,.28)}
html[data-theme='light'] .dayb.today{box-shadow:0 0 14px rgba(30,155,255,.25)}
html[data-theme='light'] .toast{box-shadow:0 10px 28px rgba(30,155,255,.3)}
html[data-theme='light'] .restdone{animation:pulseL .6s ease 4}
@keyframes pulseL{0%,100%{background:rgba(30,155,255,.06)}50%{background:rgba(30,155,255,.3)}}
/* hero card follows theme */
.hero{background:linear-gradient(150deg,var(--herobg1),var(--herobg2)); color:var(--ink); border:1px solid var(--heroline) !important}
.hero h2{color:var(--ink)}
.hero .hsub{color:var(--heroink); font-size:13px}
.hero .note{background:var(--heronote); color:var(--heronoteink); border-color:transparent}
.hero .en-tag{color:var(--acc)}

@media print{nav.tabs,#startFab{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="en-tag" id="brandTag">BUILD YOUR BEST SELF</span>
      <b id="brandTitle">Mohanad — 4-Week Plan</b>
      <span class="savedot" id="savedAt">—</span>
    </div>
    <div class="savebox">
      <button class="btn small" id="btnTheme" title="Light / Dark">☀️</button>
      <button class="btn small" id="btnLang">عربي</button>
      <button class="btn small" id="btnManualSave">Save</button>
    </div>
  </header>

  <div class="offlinebanner" id="storageWarn">⚠️ Local storage unavailable in this preview — open the file in your browser so data can be saved.</div>

  <!-- ============ TODAY ============ -->
  <section class="view" id="v-today"></section>

  <!-- ============ CALENDAR / PLAN ============ -->
  <section class="view" id="v-plan"></section>

  <!-- ============ MEALS ============ -->
  <section class="view" id="v-meals"></section>

  <!-- ============ LIBRARY ============ -->
  <section class="view" id="v-lib"></section>

  <!-- ============ MORE (progress / check-in / settings / sources) ============ -->
  <section class="view" id="v-more">
    <div class="card">
      <h2 id="moreTitle">More</h2>
      <div class="grid2" id="moreGrid"></div>
    </div>
    <div id="moreBody"></div>
  </section>

  <div class="spacer"></div>
</div>

<!-- ============ WORKOUT SESSION OVERLAY ============ -->
<div id="sessionOverlay"></div>

<!-- Rest-complete audio is generated via WebAudio (no external files). -->

<div class="toast" id="toast"></div>

<dialog id="dlg"><div class="dlgin" id="dlgBody"></div></dialog>

<nav class="tabs" id="tabs">
  <button data-view="today" class="active"><span class="ic">🏠</span><span class="lbl">Today</span></button>
  <button data-view="workout" id="tabWorkout"><span class="ic">🏋️</span><span class="lbl">Workout</span></button>
  <button data-view="plan"><span class="ic">📅</span><span class="lbl">Plan</span></button>
  <button data-view="meals"><span class="ic">🍽️</span><span class="lbl">Meals</span></button>
  <button data-view="more"><span class="ic">☰</span><span class="lbl">More</span></button>
</nav>
<script>
/* =====================================================================
   DATA — menu (وجبات اللياقة TFM, extracted from official menu qrco.de/bbeE4R
   on 01/08/2026), Technogym exercise library, 28-day plan
   ===================================================================== */
'use strict';

/* ---------- TFM menu: macros as printed. scope:'protein' = القيم للمصدر البروتيني فقط،
   scope:'full' = القيم لكامل الطبق (كما هو مطبوع في المنيو) ---------- */
const MENU = {
  /* وجبات الدجاج */
  tika:{ar:'دجاج فت تكا',en:'Fit Tikka Chicken',cat:'chicken',price:26,kcal:205,p:39,f:5,c:1,scope:'protein',best:1},
  kotshi:{ar:'دجاج فت كوتشي',en:'Fit Kotchi Chicken',cat:'chicken',price:26,kcal:196.5,p:37,f:4.5,c:2,scope:'protein',best:1},
  mashwi:{ar:'دجاج فت المشوي',en:'Fit Grilled Chicken',cat:'chicken',price:26,kcal:163.5,p:32,f:3.5,c:1,scope:'protein',best:1},

const DAY_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

function buildPlan(){
  const days=[]; const start=new Date(PLAN_START+'T00:00:00');
  for(let i=0;i<28;i++){
    const dt=new Date(start.getTime()+i*86400000);
    const w=Math.floor(i/7), dow=i%7; // 0=أحد
    const wk=DAY_TEMPLATE[dow];
    const isTrain=['push','pull','legs','arms','upper'].includes(wk);
    days.push({
      idx:i+1, date:dt.toISOString().slice(0,10), dow, dayName:DAY_AR[dow],
      week:w+1, phase:WEEK_PHASES[w], workout:wk, isTrain,
      meals:MEAL_CYCLE[i%14],
      steps: w<2 ? 8000 : 10000,
      waterL: isTrain? 3.0 : 2.5,
      sleepH:'7-8'
    });
  }
  return days;
}

function calcTargets(p){
  const bmr = p.bmr && p.bmr>800 ? p.bmr : Math.round(10*p.weightKg + 6.25*p.heightCm - 5*p.age + 5);
  const tdee = Math.round(bmr * (p.activityFactor||1.45));
  const kcalTrain = Math.max(1500, Math.round((tdee - (p.deficit||650))/25)*25);
  const kcalRest = Math.max(1350, kcalTrain-200);
  let protein = Math.round(p.weightKg*2.0/5)*5; protein=Math.min(Math.max(protein, Math.round(p.weightKg*1.6)), Math.round(p.weightKg*2.4));
  return {bmr, tdee, kcalTrain, kcalRest, protein};
}

/* حساب ماكروز وجبات يوم */
function mealItemMacros(mi){
  const m=MENU[mi.id]; if(!m) return {kcal:0,p:0,f:0,c:0,ar:'?'};
  /* حصة البروتين القياسية في المنيو = 100 جرام (مثبتة في بطاقة البامية «100ق دجاج»
     ومطابقة لقيم صدر الدجاج المشوي القياسية) — mi.g يحدد الوزن المطلوب بالجرام */
  const mult = (mi.g && m.scope==='protein') ? mi.g/100 : (mi.dbl?2:1);
  return {kcal:m.kcal*mult, p:m.p*mult, f:m.f*mult, c:m.c*mult};
}
function dayMealTotals(mealDay, includeFlex){
  let t={kcal:0,p:0,f:0,c:0};
  SLOT_ORDER.forEach(s=>{
    if(s==='x'&&!includeFlex) return;
    (mealDay.slots[s]||[]).forEach(mi=>{const mm=mealItemMacros(mi); t.kcal+=mm.kcal;t.p+=mm.p;t.f+=mm.f;t.c+=mm.c;});
  });
  return t;
}

<script>

const DEFAULT_STATE = () => ({

});
let S = DEFAULT_STATE();
(function load(){

  S.settings=Object.assign({sound:true,vibrate:true,autoRest:true,lang:'en',theme:'auto',restSec:60}, S.settings||{});

/* ===================== i18n + theme ===================== */
function isAR(){ return S.settings.lang==='ar'; }
function A(ar,en){ return isAR()? ar:en; }
function restCur(){ const r=parseInt(S.settings.restSec)||60; return Math.min(300,Math.max(15,r)); }
function themeNow(){
  const t=S.settings.theme||'auto';
  if(t==='light'||t==='dark') return t;
  const h=new Date().getHours(); return (h>=6&&h<18)?'light':'dark';
}
function applyChrome(){
  const root=document.documentElement;
  root.lang=isAR()?'ar':'en'; root.dir=isAR()?'rtl':'ltr';
  root.dataset.theme=themeNow();
  document.querySelector('meta[name=theme-color]').setAttribute('content', themeNow()==='light'?'#eef2f7':'#0b0c09');

  document.getElementById('brandTitle').textContent = A('خطة مهند — ٤ أسابيع','Mohanad — 4-Week Plan');

  document.getElementById('btnManualSave').textContent = A('حفظ','Save');
  document.getElementById('storageWarn').textContent = A('⚠️ التخزين المحلي غير متاح في هذا العرض (وضع معاينة). افتح الملف مباشرة في متصفحك حتى تُحفظ بياناتك.','⚠️ Local storage unavailable in this preview — open the app in your browser so data can be saved.');
  document.getElementById('moreTitle').textContent = A('المزيد','More');
  const NAV=[['today',A('اليوم','Today')],['workout',A('التمرين','Workout')],['plan',A('الخطة','Plan')],['meals',A('الوجبات','Meals')],['more',A('المزيد','More')]];
  NAV.forEach(([v,l])=>{ const b=document.querySelector(`nav.tabs button[data-view="${v}"] .lbl`); if(b) b.textContent=l; });
  document.getElementById('moreGrid').innerHTML=`
    <button class="btn" data-go="progress">📈 ${A('التقدم','Progress')}</button>
    <button class="btn" data-go="checkin">📝 ${A('التشيك-إن الأسبوعي','Weekly Check-in')}</button>

    <button class="btn" data-go="settings">⚙️ ${A('الإعدادات والبيانات','Settings & Data')}</button>

}
function setLang(l){

  else if(dlg.open){ dlg.close(); }

}
function toggleTheme(){
  S.settings.theme = themeNow()==='light'? 'dark':'light';
  queueSave(); applyChrome(); if(SES) sessionRender(); else render();
}

let saveTimer=null;
function save(showToast){
  S.savedAt=new Date().toISOString();
  rawSet('mohanad_fit_v1', JSON.stringify(S));
  document.getElementById('savedAt').textContent = storageOK? (A('آخر حفظ: ','Saved: ')+fmtTime(S.savedAt)) : A('وضع معاينة — لا يوجد حفظ','Preview — not saved');
  if(showToast) toast(A('تم الحفظ ✓','Saved ✓'));
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>save(false),400); }
function fmtTime(iso){ const d=new Date(iso); const loc=isAR()?'ar-SA-u-ca-gregory-nu-latn':'en-GB'; return d.toLocaleDateString(loc,{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString(isAR()?'ar-SA-u-nu-latn':'en-GB',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function r1(n){ return Math.round(n*10)/10; }
function r0(n){ return Math.round(n); }

/* ===================== Helpers & schedule engine ===================== */
function daysSinceStart(){
  const start=new Date(PLAN_START+'T00:00:00'); const now=new Date();
  return Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - start)/86400000);
}
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function effOffset(i){ return i + (S.dayShift[i]||0); }
function effDate(i){ return addDays(PLAN_START, effOffset(i)); }
function totalShift(){ return S.dayShift[27]||0; }
function calDate(c){ return addDays(PLAN_START, c); }
function baseForCal(c){
  for(let i=0;i<28;i++){ if(effOffset(i)===c) return i; if(effOffset(i)>c) return null; }
  return null;
}
function todayCal(){ return Math.min(Math.max(daysSinceStart(),0), 27+totalShift()); }
function resolveCal(c){
  const i=baseForCal(c);
  if(i!=null) return {kind:'day', i};
  let next=null; for(let j=0;j<28;j++){ if(effOffset(j)>c){ next=j; break; } }
  return {kind:'gap', next};
}
function mealsForCal(c){ return MEAL_CYCLE[((c%14)+14)%14]; }
function planDay(i){ return PLAN[i]; }
function isCancelled(i){ return !!S.cancels[i]; }
function pendingTrain(i){ const d=PLAN[i]; const lg=S.workLogs[i]; return d.isTrain && !isCancelled(i) && !(lg&&lg.status==='done'); }
function wkTitle(k){ const w=WORKOUTS[k]; return A(w.title, w.titleEn||w.title); }
function wkDur(k){ const w=WORKOUTS[k]; return A(w.dur, w.durEn||w.dur); }
function dayNameOf(iso){ const dw=new Date(iso+'T00:00:00').getDay(); return A(DAY_AR[dw], DAY_EN[dw]); }
function phName(ph){ return A(ph.name, ph.nameEn||ph.name); }
function phNote(ph){ return A(ph.note, ph.noteEn||ph.note); }
function mealWhy(m){ return A(m.why, m.whyEn||m.why); }
function nm(m){ return A(m.ar, m.en||m.ar); }
function exName(ex){ return A(ex.ar, ex.en); }

function postponeDay(i){
  for(let j=i;j<28;j++) S.dayShift[j]=(S.dayShift[j]||0)+1;
  S.lastPostpone=i;
  save(true); toast(A('تم التأجيل — تمرين اليوم انتقل إلى ','Postponed — this workout moved to ')+fmtDate(effDate(i)));
  render();
}
function undoPostpone(){
  const i=S.lastPostpone; if(i==null) return;
  for(let j=i;j<28;j++) S.dayShift[j]=Math.max(0,(S.dayShift[j]||0)-1);
  S.lastPostpone=null; save(true); render();
}
function cancelDay(i){
  S.cancels[i]=true;
  const okTypes=COMP_OK[PLAN[i].workout]||[];
  for(let j=i+1;j<28;j++){
    if(PLAN[j].isTrain && !isCancelled(j) && okTypes.includes(PLAN[j].workout)){
      S.comps[j]={from:i, workout:PLAN[i].workout}; break;
    }
  }
  save(true); toast(A('أُلغي اليوم — أُضيفت سيتات تعويض للجلسة المناسبة القادمة','Day cancelled — make-up sets added to the next matching session')); render();
}
function uncancelDay(i){
  delete S.cancels[i];
  for(const j in S.comps){ if(S.comps[j].from===i) delete S.comps[j]; }
  save(true); render();
}
function confirmPostpone(i){
  openDlg(`<h3>${A('تأجيل تمرين','Postpone')} «${esc(wkTitle(PLAN[i].workout))}»${A('؟','?')}</h3>
  <p class="sub">${A('ينتقل هذا التمرين إلى اليوم التالي، وكل الأيام بعده تنزاح يوماً واحداً (تمتد نهاية الخطة يوماً). وجبات كل يوم تبقى على تاريخها.','This workout moves to the next day and everything after shifts by one day (the plan extends one day). Meals stay pinned to their dates.')}</p>
  <div class="btnrow"><button class="btn primary" onclick="dlg.close();postponeDay(${i})">${A('نعم، أجّل','Yes, postpone')}</button>
  <button class="btn ghost" onclick="dlg.close()">${A('تراجع','Back')}</button></div>`);
}
function confirmCancel(i){
  openDlg(`<h3>${A('إلغاء تمرين','Cancel')} «${esc(wkTitle(PLAN[i].workout))}»${A('؟','?')}</h3>
  <p class="sub">${A('اليوم يُلغى نهائياً ولا يُحسب تمريناً، والجدول لا يتحرك. سيضيف التطبيق «سيتات تعويض» (+1 سيت على أول 3 تمارين) في أقرب جلسة تغطي نفس العضلات.','This day is cancelled for good and does NOT count as trained; the schedule stays put. The app adds make-up sets (+1 set on the first 3 exercises) to the next session covering the same muscles.')}</p>
  <div class="btnrow"><button class="btn danger" onclick="dlg.close();cancelDay(${i})">${A('ألغِ اليوم','Cancel the day')}</button>
  <button class="btn ghost" onclick="dlg.close()">${A('تراجع','Back')}</button></div>`);
}
function dayManageHTML(i, dark){
  if(!pendingTrain(i)) {
    if(isCancelled(i)) return `<div class="warnnote">${A('يوم ملغى — لا يُحسب تمريناً، والتعويض مضاف للجلسة المناسبة.','Cancelled day — not counted as trained; make-up sets added to the next matching session.')} <button class="btn small" onclick="uncancelDay(${i})">${A('تراجع عن الإلغاء','Undo cancel')}</button></div>`;
    return '';
  }
  const st=dark?'style="background:var(--heronote);color:var(--ink)"':'';
  return `<div class="btnrow">
    <button class="btn small" ${st} onclick="confirmPostpone(${i})">⏭️ ${A('ما أقدر اليوم — أجّله لبكرة',"Can't today — postpone to tomorrow")}</button>
    <button class="btn small" ${st} onclick="confirmCancel(${i})">🗓️ ${A('ألغِ هذا اليوم (مع تعويض)','Cancel this day (with make-up)')}</button>
    ${S.lastPostpone!=null?`<button class="btn small ghost" ${st} onclick="undoPostpone()">↩️ ${A('تراجع عن آخر تأجيل','Undo last postpone')}</button>`:''}
  </div>`;
}
function targets(){ return calcTargets(S.profile); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(isAR()?'ar-SA-u-ca-gregory-nu-latn':'en-GB',{day:'numeric',month:'long'}); }
const fmtDateAr=fmtDate;
function dayWorkLog(i){ if(!S.workLogs[i]) S.workLogs[i]={sets:{},replaced:{},status:null,cardioDone:false}; return S.workLogs[i]; }
function dayMealLog(i){ if(!S.mealLogs[i]) S.mealLogs[i]={}; return S.mealLogs[i]; }

/* اقتراح وزن الجلسة القادمة */
function lastPerf(exId, beforeIdx){
  for(let i=(beforeIdx==null?27:beforeIdx-1); i>=0; i--){
    const lg=S.workLogs[i]; if(lg && lg.sets && lg.sets[exId] && lg.sets[exId].length){ return {sets:lg.sets[exId], dayIdx:i}; }
  }
  return null;
}
function suggestLoad(exId, dayI){
  const ex=EX[exId];
  if(ex.cardio||ex.load==='time'||ex.load==='body') return null;
  const prev=lastPerf(exId, dayI);
  if(!prev){ return {lo:ex.start[0], hi:ex.start[1], why:A('وزن بداية تحفظي — عايره في أول جلسة (احتياطي 3-4 تكرارات)','Conservative starting load — calibrate in session 1 (leave 3-4 reps in reserve)')}; }
  const done=prev.sets.filter(s=>!s.skip && s.w!=null);
  if(!done.length) return {lo:ex.start[0], hi:ex.start[1], why:A('لا يوجد سجل مكتمل — ابدأ من نطاق البداية','No completed log yet — start from the starting range')};
  const maxW=Math.max(...done.map(s=>+s.w||0));
  const pain=done.some(s=>s.pain);
  const avgRIR=done.reduce((a,s)=>a+(s.rir==null?2:+s.rir),0)/done.length;
  const block=findBlock(exId); const topReps=block? +String(block.reps).split('-').pop().replace(/[^0-9]/g,'')||12 : 12;
  const hitTop=done.every(s=>(+s.r||0)>=topReps);
  const inc = ex.load==='db'?2:(ex.load==='cable'?2.5:2.5);
  const S1=(v)=> ex.load==='db'? snapDb(v):v;
  if(pain) return {lo:S1(Math.max(2,r1(maxW*0.85))), hi:S1(r1(maxW*0.9)), why:A('سجلت ألماً — خفف 10-15% وراقب، وبدّل التمرين إذا استمر','You logged pain — drop 10-15%, monitor, and swap the exercise if it persists')};
  if(avgRIR<=0.5) return {lo:S1(r1(maxW*0.95)), hi:S1(maxW), why:A('وصلت قريباً من الفشل — ثبّت أو خفف قليلاً وركز على الأداء','You got very close to failure — hold or slightly reduce and focus on form')};
  if(hitTop && avgRIR>=1.5){ const nw= ex.load==='db'? (DB_WEIGHTS[DB_WEIGHTS.indexOf(snapDb(maxW))+1]||snapDb(maxW)) : maxW+inc; return {lo:nw, hi:nw, why: ex.load==='db'? A('زد لدرجة الدمبل التالية المتوفرة (درجات Technogym: 1-10 كجم ثم قفزات 2 كجم)','Move up to the next available dumbbell (Technogym steps: 1-10 kg, then 2 kg jumps)'):A('وصلت أعلى النطاق بسهولة — زد درجة واحدة (~'+inc+' كجم حسب درجات الجهاز)','Top of the rep range with ease — go up one increment (~'+inc+' kg, machine steps permitting)')}; }
  return {lo:S1(maxW), hi:S1(maxW), why:A('استمر بنفس الوزن وزد التكرارات داخل النطاق','Keep the same load and add reps within the range')};
}
function findBlock(exId){
  for(const k in WORKOUTS){ const b=(WORKOUTS[k].blocks||[]).find(x=>x.ex===exId); if(b) return b; }
  return null;
}
function loadTypeTxt(t){
  const AR={stack:'وزن المكدس (اختر الدرجة بالكجم)',plate:'أطباق: الوزن لكل جهة',db:'وزن الدمبل الواحد',cable:'درجة المكدس — نسب البكرات قد تغير المقاومة الفعلية',barbell:'الوزن الكلي شامل البار',body:'وزن الجسم',time:'بالثواني',cardio:''};
  return A(AR[t]||'', LOADTYPE_EN[t]||'');
}

/* ===================== Router ===================== */
const VIEWS=['today','plan','meals','lib','more'];
let curView='today', moreSub=null,
    selectedPlanDay=Math.min(Math.max(daysSinceStart(),0),27),
    selectedMealDay=Math.min(Math.max(daysSinceStart(),0),27);
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const v=b.dataset.view;
  if(v==='workout'){ openWorkoutEntry(); return; }
  showView(v);
});
function showView(v, sub){
  curView=v; moreSub=sub||null;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  VIEWS.forEach(x=>{ const el=document.getElementById('v-'+x); if(el) el.classList.toggle('active', x===v); });
  render();
  window.scrollTo({top:0});
}
function render(){
  if(curView==='today') renderToday();
  else if(curView==='plan') renderPlan();
  else if(curView==='meals') renderMeals();
  else if(curView==='lib') renderLib();
  else if(curView==='more') renderMore();
  save(false);
}

/* ===================== TODAY ===================== */
function renderToday(){
  const c=todayCal(), res=resolveCal(c), t=targets();
  const todayStr=calDate(c);
  const gap=res.kind==='gap';
  const i=gap? res.next : res.i;
  const d=planDay(i==null?27:i);
  const w=WORKOUTS[d.workout];
  const cancelled=!gap&&isCancelled(i);
  const isTrainToday=!gap && d.isTrain && !cancelled;
  const lg=!gap? S.workLogs[i]:null; const wDone=lg&&lg.status==='done';
  const meals=mealsForCal(c);
  const mlog=dayMealLog(c);
  const mt=dayMealTotals(meals,true), mtCore=dayMealTotals(meals,false);
  const kcalT=isTrainToday? t.kcalTrain : t.kcalRest;
  const wLog=S.weights.find(x=>x.date===todayStr);
  const before=daysSinceStart()<0;
  let html='';
  const comp=!gap? S.comps[i]:null;
  html+=`<div class="card hero">
    <span class="en-tag">${gap?'EXTRA REST':esc(w.en||'GET MOVING')}</span>
    <h2 style="font-size:22px;margin-top:2px">${gap? A('يوم مؤجل — راحة إضافية','Postponed day — extra rest') : dayNameOf(todayStr)+A(' — يوم ',' — Day ')+d.idx+A(' من 28',' of 28')}</h2>
    <div class="hsub">${fmtDate(todayStr)} • ${esc(phName(d.phase))}${totalShift()?` • ${A('الخطة ممتدة حتى ','plan extended to ')}${fmtDate(effDate(27))}`:''}</div>
    <div class="btnrow">

function saveDaily(dateStr){
  const w=parseFloat(document.getElementById('wIn').value);

  if(w&&w>30&&w<250){ const ex=S.weights.find(x=>x.date===dateStr); if(ex) ex.kg=w; else S.weights.push({date:dateStr,kg:w}); S.weights.sort((a,b)=>a.date<b.date?-1:1); }

}

function markMeal(i,key,st){
  const ml=dayMealLog(i);

function swapMeal(i,key,curId){
  const cur=MENU[curId];
  const alts=Object.keys(MENU).filter(k=>{
    const m=MENU[k];
    if(k===curId) return false;
    if(cur.cat==='carb'||cur.cat==='lowcarb') return m.cat==='carb'||m.cat==='lowcarb';
    if(cur.cat==='chicken'||cur.cat==='beef'||cur.cat==='seafood') return ['chicken','beef'].includes(m.cat);
    return m.cat===cur.cat;
  });
  let h=`<h3>${A('بدّل','Swap')} «${esc(nm(cur))}» ${A('بصنف من نفس الفئة','for another item in the same category')}</h3><div style="max-height:50vh;overflow:auto">`;
  alts.forEach(k=>{ const m=MENU[k];
    h+=`<div class="meal" style="cursor:pointer" onclick="applySwap(${i},'${key}','${k}')"><b>${esc(nm(m))}</b>
    <div class="macro"><span class="mtag">${r0(m.kcal)} kcal</span><span class="mtag">P ${r0(m.p)}</span><span class="mtag">C ${r0(m.c)}</span>${m.price?`<span class="mtag">${m.price}${A(' ر.س',' SAR')}</span>`:''}</div></div>`;
  });
  h+=`</div><div class="btnrow"><button class="btn" onclick="dlg.close()">${A('إغلاق','Close')}</button></div>`;
  openDlg(h);
}

    html+=`<div class="note">${d.workout==='restActive'? '🚶 '+esc(A(WORKOUTS.restActive.cardio.note,WORKOUTS.restActive.cardio.noteEn)) : '🛌 '+A('راحة كاملة — الأهم: نوم 7-8 ساعات وماء كافٍ وخطواتك اليومية.','Full rest — priorities: 7-8h sleep, water, and your daily steps.')}</div>`;
  }
  html+=`<div class="hr"></div><h3>${A('وجبات','Meals for')} ${fmtDate(ed)} <span class="chip">${r0(dayMealTotals(meals,false).kcal)}–${r0(mt.kcal)} kcal • P ${r0(mt.p)}</span></h3>`;
  html+=mealsChecklistHTML(cal,{meals:meals},dayMealLog(cal),false);
  html+=`</div>`;
  return html;
}

  }
  html+='</div></div>';
  const c=Math.min(selectedMealDay,lastCal); const meals=mealsForCal(c); const t=targets();

  const ds=calDate(c);
  const core=dayMealTotals(meals,false), full=dayMealTotals(meals,true);
  html+=`<div class="card"><h2>${dayNameOf(ds)} ${fmtDate(ds)} ${isT?`<span class="chip dark">${A('تدريب','training')}</span>`:`<span class="chip">${A('راحة','rest')}</span>`}</h2>
  <div class="grid4" style="margin-top:6px">
    <div class="tile"><div class="v">${r0(core.kcal)}</div><div class="l">${A('أساسي kcal','core kcal')}</div></div>
    <div class="tile"><div class="v">${r0(full.kcal)}</div><div class="l">${A('مع سناك الجوع','w/ flex snack')}</div></div>
    <div class="tile"><div class="v">${r0(full.p)}</div><div class="l">${A('بروتين غ','protein g')}</div></div>
    <div class="tile"><div class="v">${isT?t.kcalTrain:t.kcalRest}</div><div class="l">${A('الهدف kcal','target kcal')}</div></div>
  </div>
  ${mealsChecklistHTML(c,{meals:meals},dayMealLog(c),false)}
  <div class="note">💡 ${esc(mealWhy(meals))}</div></div>`;
  html+=`<div class="card"><h2>📖 ${A('دليل المنيو الكامل','Full Menu Guide')}</h2><div class="sub">${A('كل الأصناف المتاحة للتبديل (الأسعار بالريال، القيم كما في المنيو)','Everything available for swaps (prices in SAR, values as printed)')}</div>`;
  ['chicken','beef','seafood','pasta','burger','wrap','salad','snack','drink','carb','lowcarb','sauce'].forEach(cat=>{
    const items=Object.keys(MENU).filter(k=>MENU[k].cat===cat);
    if(!items.length) return;
    html+=`<h3 style="margin-top:12px">${A(CAT_AR[cat],CAT_EN[cat])}${cat==='seafood'?` <span class="chip warn">${A('خارج خطتك — بدون بحري بطلبك','excluded — no seafood, per your request')}</span>`:''}</h3><table class="mini"><tr><th>${A('الصنف','Item')}</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th>${A('ر.س','SAR')}</th></tr>`;
    items.forEach(k=>{ const m=MENU[k];
      html+=`<tr><td>${esc(nm(m))}${m.lc?` <span class="chip ok">${A('لو كارب','low-carb')}</span>`:''}${m.best?' ⭐':''}</td><td class="num">${m.kcal}</td><td class="num">${m.p}</td><td class="num">${m.c}</td><td class="num">${m.f}</td><td class="num">${m.price||'—'}</td></tr>`; });
    html+='</table>';
  });
  html+=`<div class="note">${A('القيم من بطاقات المنيو الرسمية (سُحبت في 01/08/2026). وجبات الدجاج/اللحم قيمها لكل 100 جرام من المصدر البروتيني — أضف جانب الكارب. إذا تغير المنيو أرسل النسخة الجديدة وسأحدث الخطة دون فقدان سجلاتك.','Values from the official menu cards (captured 01/08/2026). Chicken/beef values are per 100 g of the protein source — add your carb side. If the menu changes, send the new version and the plan updates without losing your logs.')}</div></div>`;
  document.getElementById('v-meals').innerHTML=html;
}

/* ===================== LIBRARY ===================== */
function renderLib(){
  let html=`<div class="card"><h2>📚 ${A('مكتبة التمارين','Exercise Library')} <span class="en-tag">TECHNOGYM</span></h2>
  <div class="sub">${A('الأسماء بصيغة «الخط + الوظيفة» لأن موديلات ناديك لم تُؤكد بعد — أرسل صور الأجهزة وسأطابقها بدقة. كل تمرين فيه فيديو مباشر + صفحة الجهاز الرسمية.',"Names use Technogym line + function since your gym's exact models aren't confirmed yet — send machine photos for exact matching. Every exercise has a direct video + the official machine page.")}</div></div>`;
  const G=(ar,en)=>A(ar,en);
  const groups={
    [G('صدر','Chest')]:['chestPress','inclinePressM','pecFly'],
    [G('ظهر','Back')]:['latPulldown','vertTraction','seatedRow','reverseFly','facePull'],
    [G('كتف','Shoulders')]:['shoulderPress','latRaise','latRaiseCable'],
    [G('بايسبس','Biceps')]:['dbCurl','cableCurl','preacherCurl','inclineDbCurl','hammerCurl'],
    [G('ترايسبس','Triceps')]:['pushdown','overheadExt','armExtM','dipsMachine'],
    [G('أرجل ومؤخرة','Legs & Glutes')]:['legPress','legExt','legCurl','calfRaise','hipAbd','gluteKickback'],
    [G('جذع وبطن','Core & Abs')]:['crunchM','plank','kneeRaise'],

  for(const g in groups){

    groups[g].forEach(id=>{ const ex=EX[id];
      html+=`<div class="exrow"><div class="t" onclick="this.parentElement.classList.toggle('open')">
      <div><b>${esc(exName(ex))}</b><div class="meta" dir="ltr" style="text-align:start">${esc(isAR()? ex.en : ex.ar)}</div></div><span class="tg">TG</span></div>
      <div class="body">${exDetailHTML(id)}</div></div>`; });
    html+='</div>';
  }
  document.getElementById('v-lib').innerHTML=html;
}
</script>
<script>
/* ===================== WORKOUT SESSION ENGINE ===================== */
let SES=null, sesTick=null;
let audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); }
function beep(){
  if(!S.settings.sound) return; ensureAudio(); if(!audioCtx) return;
  try{
    const now=audioCtx.currentTime;
    [0,0.25,0.5].forEach((t,ix)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value= ix===2? 1180:880; o.type='sine';
      g.gain.setValueAtTime(0.0001,now+t); g.gain.exponentialRampToValueAtTime(0.35,now+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+t+0.22);
      o.start(now+t); o.stop(now+t+0.24);
    });
  }catch(e){}
}
function buzz(){ if(S.settings.vibrate && navigator.vibrate){ try{navigator.vibrate([250,120,250]);}catch(e){} } }

function openWorkoutEntry(){
  ensureAudio();
  if(S.sessionActive){ SES=S.sessionActive; showSession(); return; }
  const c=todayCal(); const res=resolveCal(c);
  if(res.kind==='day' && PLAN[res.i].isTrain && !isCancelled(res.i)){ startSession(res.i); return; }
  let h=`<h3>${res.kind==='gap'? A('اليوم راحة (يوم مؤجل) ⏭','Today is rest (postponed day) ⏭'):A('اليوم يوم راحة 🛌','Today is a rest day 🛌')}</h3><p class="sub">${A('تبي تفتح تمريناً من يوم آخر؟','Want to open a workout from another day?')}</p>`;
  const anchor=res.kind==='gap'? res.next : res.i;
  PLAN.forEach(x=>{ const j=x.idx-1;
    if(x.isTrain && !isCancelled(j) && Math.abs(j-anchor)<=7){ const ed=effDate(j);
      h+=`<button class="btn" style="margin:3px" onclick="dlg.close();startSession(${j})">${ed.slice(8,10)}/${ed.slice(5,7)} — ${esc(wkTitle(x.workout))}</button>`; }
  });
  h+=`<div class="btnrow"><button class="btn ghost" onclick="dlg.close()">${A('إغلاق','Close')}</button></div>`;
  openDlg(h);
}
function startSession(dayI){
  ensureAudio();
  const d=planDay(dayI); if(!d.isTrain){ toast(A('هذا يوم راحة','That is a rest day')); return; }
  const lg=dayWorkLog(dayI);
  SES={ dayI, wk:d.workout, exI:0, setI:0, startTs:Date.now(), pausedAt:null, pausedAccum:0,
        restEndTs:null, restTotal:0, phase:'work', cardio:false, replaced:lg.replaced||{} };
  S.sessionActive=SES; save(false);
  showSession();
}
function sesBlocks(){ return WORKOUTS[SES.wk].blocks; }
function curBlock(){ return sesBlocks()[SES.exI]; }
function blkSets(bx){ const b=sesBlocks()[bx]; return b.sets + compExtra(SES.dayI, bx, b.ex); }
function sesElapsed(){
  const base=(SES.pausedAt||Date.now())-SES.startTs-SES.pausedAccum;
  return Math.max(0,Math.floor(base/1000));
}
function fmtMMSS(s){ const m=Math.floor(s/60), x=s%60; return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }

function showSession(){
  document.getElementById('sessionOverlay').classList.add('on');
  document.body.style.overflow='hidden';
  clearInterval(sesTick); sesTick=setInterval(sessionTickRender,1000);
  sessionRender();
}
function hideSession(){
  document.getElementById('sessionOverlay').classList.remove('on');
  document.body.style.overflow='';
  clearInterval(sesTick); sesTick=null;
  render();
}
function sessionTickRender(){
  if(!SES) return;
  const tEl=document.getElementById('sesTime'); if(tEl) tEl.textContent=fmtMMSS(sesElapsed());
  if(SES.phase==='rest' && !SES.pausedAt){
    const left=Math.ceil((SES.restEndTs-Date.now())/1000);
    const rEl=document.getElementById('restLeft');
    if(rEl) rEl.textContent=fmtMMSS(Math.max(0,left));
    const pb=document.getElementById('restBar');
    if(pb) pb.style.width=Math.max(0,Math.min(100,100*left/SES.restTotal))+'%';
    if(left<=0){ SES.phase='work'; SES.restEndTs=null; beep(); buzz(); queueSave(); sessionRender(true); }
  }
}
function sessionRender(restJustEnded){
  if(!SES) return;
  const d=planDay(SES.dayI), w=WORKOUTS[SES.wk], blocks=sesBlocks();
  const lg=dayWorkLog(SES.dayI);
  const total=blocks.reduce((a,b,ix)=>a+blkSets(ix),0);
  const doneSets=Object.values(lg.sets).flat().filter(s=>s&&!s.skip).length;
  let h=`<div class="shead">
    <div><span class="en-tag">${esc(w.en)}</span><h3 style="margin:0;color:var(--sesink)">${esc(wkTitle(SES.wk))}</h3>
    <div class="sub" style="color:var(--sesink2)">${dayNameOf(effDate(SES.dayI))} — ${A('يوم','Day')} ${d.idx} • RIR ${d.phase.rir}</div></div>
    <div style="text-align:end"><div class="stime" id="sesTime">${fmtMMSS(sesElapsed())}</div>
    <div class="btnrow" style="margin:4px 0 0">
      <button class="btn small sbtn" onclick="togglePause()">${SES.pausedAt? A('▶️ استئناف','▶️ Resume'):A('⏸️ إيقاف','⏸️ Pause')}</button>
      <button class="btn small sbtn" onclick="confirmEnd()">⏹️ ${A('إنهاء','End')}</button>
    </div></div></div>
  <div class="progressbar g" style="margin:10px 0 2px"><i style="width:${r0(100*doneSets/total)}%"></i></div>
  <div class="sub" style="color:var(--sesink2)">${doneSets} ${A('من','of')} ${total} ${A('سيت','sets')}</div>`;

  if(SES.pausedAt){
    h+=`<div class="scard center"><h3>⏸️ ${A('الجلسة موقوفة','Session paused')}</h3><p class="sub" style="color:var(--sesink2)">${A('المؤقت متوقف — كمل وقت ما تكون جاهز.','Timer stopped — resume whenever you are ready.')}</p>
    <button class="btn sbtn primary big" onclick="togglePause()">${A('استئناف التمرين','Resume workout')}</button></div>`;
    document.getElementById('sessionOverlay').innerHTML=h; return;
  }

  if(SES.cardio){
    const c=EX[w.cardio.ex];
    h+=`<div class="scard"><h3>🫀 ${A('الكارديو الختامي: ','Finishing cardio: ')}${esc(exName(c))} — ${w.cardio.min} ${A('دقيقة','min')}</h3>
    <div class="sub" style="color:var(--sesink2)">${esc(A(w.cardio.note,w.cardio.noteEn||w.cardio.note))} • ${esc(c.tg)}</div>
    <ul style="color:var(--sesink2);padding-inline-start:18px">${A(c.setup,c.setupEn||c.setup).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
    <div class="btnrow">
      <button class="btn sbtn primary" onclick="dayWorkLog(SES.dayI).cardioDone=true;finishSession()">✓ ${A('خلصت الكارديو — أنهِ الجلسة','Cardio done — finish session')}</button>
      <button class="btn sbtn" onclick="finishSession()">${A('تخطَّ الكارديو وأنهِ','Skip cardio & finish')}</button>
    </div></div>`;
    document.getElementById('sessionOverlay').innerHTML=h; return;
  }

  const b=curBlock(); const ex=EX[b.ex]; const sg=suggestLoad(b.ex,SES.dayI);
  const sets=lg.sets[b.ex]||[];
  const replaced=SES.replaced[b.ex];
  h+=`<div class="scard ${SES.phase==='rest'?'resting':''} ${restJustEnded?'restdone':''}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <div><h3 style="margin:0">${esc(exName(ex))} ${replaced?`<span class="chip warn">${A('بديل: ','alt: ')}${esc(replaced)}</span>`:''}</h3>
      <div class="sub" style="color:var(--sesink2)">${esc(ex.tg)} • ${A('تمرين','exercise')} ${SES.exI+1}/${blocks.length}</div></div>
      <span class="tg">TG</span></div>
    <div class="setdots">${Array.from({length:blkSets(SES.exI)},(_,k)=>`<i class="${sets[k]&&!sets[k].skip?'d':''} ${k===SES.setI?'cur':''}"></i>`).join('')}</div>`;

  if(SES.phase==='rest'){
    const left=Math.max(0,Math.ceil((SES.restEndTs-Date.now())/1000));
    h+=`<div class="center"><div class="sub" style="color:var(--acc);font-weight:800">${A('استراحة — السيت القادم: ','Rest — next set: ')}${SES.setI+1} ${A('من','of')} ${blkSets(SES.exI)}</div>
    <div class="bigtimer" id="restLeft">${fmtMMSS(left)}</div>
    <div class="progressbar" style="background:var(--sesline)"><i id="restBar" style="background:var(--acc);width:${r0(100*left/SES.restTotal)}%"></i></div>
    <div class="btnrow" style="justify-content:center">
      <button class="btn sbtn" onclick="adjRest(-15)">−15${A('ث','s')}</button>
      <button class="btn sbtn" onclick="adjRest(15)">+15${A('ث','s')}</button>
      <button class="btn sbtn primary" onclick="skipRest()">${A('تخطَّ الاستراحة ←','Skip rest →')}</button>
    </div></div>`;
  } else {
    h+=`<div class="sub" style="color:var(--sesink2);margin-top:4px">${A('السيت','Set')} <b class="snum">${SES.setI+1}</b> ${A('من','of')} <b class="snum">${blkSets(SES.exI)}</b> • ${A('الهدف','target')} <b class="snum">${b.reps}</b> ${A('تكرار','reps')} • ${A('راحة','rest')} ${restCur()}${A('ث','s')} • RIR ${d.phase.rir}</div>
    ${sg?`<div class="sub" style="color:var(--acc);margin-top:2px">${A('وزن مقترح: ','Suggested: ')}<b class="snum">${sg.lo===sg.hi?sg.lo:sg.lo+'–'+sg.hi} ${A('كجم','kg')}</b> — ${esc(sg.why)}</div>`:''}
    <div class="sgrid" style="margin-top:10px">
      <div><label class="f">${A('الوزن الفعلي (كجم)','Actual weight (kg)')}</label><input type="number" step="0.5" inputmode="decimal" id="inW" value="${sets[SES.setI]?.w ?? (sg? sg.lo:'')}"></div>
      <div><label class="f">${A('التكرارات الفعلية','Actual reps')}</label><input type="number" inputmode="numeric" id="inR" value="${sets[SES.setI]?.r ?? ''}" placeholder="${b.reps}"></div>
      <div><label class="f">RIR</label><input type="number" inputmode="numeric" id="inRIR" value="${sets[SES.setI]?.rir ?? ''}" placeholder="${d.phase.rir}"></div>
    </div>
    <div class="btnrow" style="align-items:center">
      <label style="display:flex;align-items:center;gap:6px;color:var(--sesink2);font-size:13px"><input type="checkbox" id="inPain" style="width:18px;height:18px" ${sets[SES.setI]?.pain?'checked':''}> ${A('ألم/انزعاج','Pain/discomfort')}</label>
      <input type="text" id="inNote" placeholder="${A('ملاحظة (اختياري)','Note (optional)')}" style="flex:1;min-width:120px" value="${esc(sets[SES.setI]?.note||'')}">
    </div>
    <div class="btnrow">
      <button class="btn sbtn primary big" onclick="completeSet()">✓ ${A('أنهيت السيت — ابدأ الاستراحة','Set done — start rest')}</button>
    </div>
    <div class="btnrow">
      <button class="btn small sbtn" onclick="skipExercise()">${A('تخطَّ التمرين','Skip exercise')}</button>
      <button class="btn small sbtn" onclick="replaceExercise()">🔁 ${A('بدّل التمرين (الجهاز مشغول)','Swap (machine busy)')}</button>
      <button class="btn small sbtn" onclick="showExInfo('${b.ex}')">ℹ️ ${A('طريقة الأداء','How to')}</button>
    </div>`;
  }
  h+=`</div>`;
  h+=`<div class="scard"><div class="sub" style="color:var(--sesink2);font-weight:800">${A('بقية الجلسة','Rest of session')}</div>`;
  blocks.forEach((bb,ix)=>{
    const exx=EX[bb.ex]; const st=lg.sets[bb.ex]||[]; const dn=st.filter(s=>s&&!s.skip).length;
    h+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--sesline);${ix===SES.exI?'color:var(--sesink);font-weight:800':'color:var(--sesink3)'}">
    <span>${ix===SES.exI?'▸ ':''}${esc(exName(exx))}</span><span class="snum">${dn}/${blkSets(ix)}</span></div>`;
  });
  h+=`<div style="display:flex;justify-content:space-between;padding:6px 0;color:var(--sesink3)"><span>🫀 ${esc(exName(EX[w.cardio.ex]))}</span><span class="snum">${w.cardio.min}${A('د','m')}</span></div></div>`;
  h+=`<div class="sub center" style="color:var(--sesink3);margin-top:4px">${A('الصوت','Sound')} ${S.settings.sound? A('مفعل','on'):A('مطفأ','off')} • ${A('الاهتزاز','Vibration')} ${S.settings.vibrate? A('مفعل','on'):A('مطفأ','off')} — ${A('من الإعدادات','in Settings')}</div>`;
  document.getElementById('sessionOverlay').innerHTML=h;
}
function showExInfo(exId){
  const ex=EX[exId];
  openDlg(`<h3>${esc(exName(ex))}</h3>${exDetailHTML(exId)}<div class="btnrow"><button class="btn" onclick="dlg.close()">${A('رجوع للتمرين','Back to workout')}</button></div>`);
}
function completeSet(){
  const b=curBlock(); const lg=dayWorkLog(SES.dayI);
  if(!lg.sets[b.ex]) lg.sets[b.ex]=[];
  const w=parseFloat(document.getElementById('inW').value);
  const r=parseInt(document.getElementById('inR').value);
  const rir=document.getElementById('inRIR').value===''?null:parseInt(document.getElementById('inRIR').value);
  const pain=document.getElementById('inPain').checked;
  const note=document.getElementById('inNote').value.trim();
  lg.sets[b.ex][SES.setI]={w:isNaN(w)?null:w, r:isNaN(r)?null:r, rir, pain, note, skip:false};
  if(pain) toast(A('سُجل الألم — إذا كان حاداً أوقف التمرين وبدّله','Pain logged — if sharp, stop and swap the exercise'));
  const lastSetOfEx=SES.setI>=blkSets(SES.exI)-1;
  const lastEx=SES.exI>=sesBlocks().length-1;
  if(lastSetOfEx && lastEx){ SES.cardio=true; queueSave(); sessionRender(); return; }
  if(lastSetOfEx){ SES.exI++; SES.setI=0; } else { SES.setI++; }
  SES.phase='rest'; SES.restTotal=restCur(); SES.restEndTs=Date.now()+restCur()*1000;
  queueSave(); sessionRender();
}
function adjRest(dsec){ if(SES.phase!=='rest') return; SES.restEndTs+=dsec*1000; SES.restTotal=Math.max(15,SES.restTotal+dsec); queueSave(); sessionRender(); }
function skipRest(){ SES.phase='work'; SES.restEndTs=null; queueSave(); sessionRender(); }
function skipExercise(){
  const b=curBlock(); const lg=dayWorkLog(SES.dayI);
  if(!lg.sets[b.ex]) lg.sets[b.ex]=[];
  for(let k=SES.setI;k<blkSets(SES.exI);k++){ if(!lg.sets[b.ex][k]) lg.sets[b.ex][k]={skip:true}; }
  if(SES.exI>=sesBlocks().length-1){ SES.cardio=true; } else { SES.exI++; SES.setI=0; SES.phase='work'; }
  queueSave(); sessionRender();
}
function replaceExercise(){
  const b=curBlock(); const ex=EX[b.ex];
  openDlg(`<h3>${A('بدّل','Swap')} «${esc(exName(ex))}»</h3><p class="sub">${A('البديل المقترح: ','Suggested alternative: ')}<b>${esc(A(ex.alt,ex.altEn||ex.alt))}</b> — ${A('بنفس السيتات والتكرارات.','same sets and reps.')}</p>
  <div class="btnrow">
    <button class="btn primary" onclick="SES.replaced['${b.ex}']=A(EX['${b.ex}'].alt,EX['${b.ex}'].altEn||EX['${b.ex}'].alt);dayWorkLog(SES.dayI).replaced['${b.ex}']=SES.replaced['${b.ex}'];dlg.close();queueSave();sessionRender();toast(A('استخدم البديل وسجل عليه','Use the alternative and log on it'))">${A('استخدم البديل','Use alternative')}</button>
    <button class="btn ghost" onclick="dlg.close()">${A('إلغاء','Cancel')}</button>
  </div>`);
}
function togglePause(){
  if(SES.pausedAt){ const pd=Date.now()-SES.pausedAt; SES.pausedAccum+=pd; if(SES.restEndTs) SES.restEndTs+=pd; SES.pausedAt=null; }
  else SES.pausedAt=Date.now();
  queueSave(); sessionRender();
}
function confirmEnd(){
  const lg=dayWorkLog(SES.dayI);
  const done=Object.values(lg.sets).flat().filter(s=>s&&!s.skip).length;
  openDlg(`<h3>⏹️ ${A('إيقاف الجلسة — وش تبي أسوي بأداء اليوم؟',"Stop session — what should I do with today's work?")}</h3>
  <p class="sub">${A('سجلت حتى الآن','Logged so far:')} <b>${done}</b> ${A('سيت','sets')}.</p>
  <div class="btnrow" style="flex-direction:column;align-items:stretch">
    <button class="btn primary" onclick="dlg.close();finishSession()">✅ ${A('أنهِ واحفظ اللي سويته','Finish & save what I did')}</button>
    <button class="btn danger" onclick="discardSession()">🗑️ ${A('أوقفه واحذف أي أداء — كأني ما تمرنت اليوم',"Stop & delete everything — as if I didn't train today")}</button>
    <button class="btn ghost" onclick="dlg.close()">▶️ ${A('لا، أكمل التمرين','No, keep training')}</button>
  </div>`);
}
function discardSession(){
  const i=SES.dayI;
  S.workLogs[i]={sets:{},replaced:{},status:null,cardioDone:false};
  S.sessionActive=null; SES=null;
  save(true); hideSession();
  const nxt=nextTrainAfter(i);
  openDlg(`<h3>🗑️ ${A('انحذف أداء اليوم — طيب وش مصير تمرين','Performance deleted — so what happens to')} «${esc(wkTitle(PLAN[i].workout))}»${A('؟','?')}</h3>
  <div class="btnrow" style="flex-direction:column;align-items:stretch">
    <button class="btn primary" onclick="dlg.close();postponeDay(${i})">⏭️ ${A('أجّله لبكرة — بكرة أسوي','Postpone to tomorrow — tomorrow I do')} «${esc(wkTitle(PLAN[i].workout))}» ${A('وكل الجدول ينزاح يوم','and the whole schedule shifts a day')}</button>
    <button class="btn" onclick="dlg.close();cancelDay(${i})">🗓️ ${A('ألغِ اليوم نهائياً — ','Cancel this day — ')}${nxt? A('بكرة على جدوله «','tomorrow stays on schedule: “')+esc(wkTitle(PLAN[nxt].workout))+A('»','”'):A('نكمل على الجدول','we continue on schedule')} ${A('مع سيتات تعويض','with make-up sets')}</button>
    <button class="btn ghost" onclick="dlg.close()">⏸️ ${A('اتركه لليوم — يمكن أرجع أكمله','Leave it for today — I might come back')}</button>
  </div>
  <p class="sub" style="margin-top:8px">${A('الإلغاء لا يُحسب تمريناً، والتأجيل يمدد نهاية الخطة يوماً واحداً. تقدر تتراجع عن الاثنين لاحقاً.','Cancelling does not count as trained; postponing extends the plan by one day. Both can be undone later.')}</p>`);
}
function nextTrainAfter(i){
  for(let j=i+1;j<28;j++){ if(PLAN[j].isTrain && !isCancelled(j)) return j; }
  return null;
}
function finishSession(){
  const lg=dayWorkLog(SES.dayI); const w=WORKOUTS[SES.wk]; const blocks=sesBlocks();
  const dur=sesElapsed(); lg.durationSec=dur;
  const total=blocks.reduce((a,b,ix)=>a+blkSets(ix),0);
  const doneSets=Object.values(lg.sets).flat().filter(s=>s&&!s.skip).length;
  lg.status = doneSets>=total*0.6 ? 'done':'partial';
  let vol=0; blocks.forEach(b=>{ (lg.sets[b.ex]||[]).forEach(s=>{ if(s&&!s.skip&&s.w&&s.r) vol+=s.w*s.r; }); });
  let sug='';
  blocks.forEach(b=>{ const sgN=suggestLoad(b.ex, SES.dayI+1); if(sgN) sug+=`<tr><td>${esc(exName(EX[b.ex]))}</td><td class="num">${sgN.lo===sgN.hi?sgN.lo:sgN.lo+'–'+sgN.hi}</td></tr>`; });
  const h=`<h3>✅ ${A('ملخص الجلسة — ','Session summary — ')}${esc(wkTitle(SES.wk))}</h3>
  <div class="grid3" style="margin:8px 0">
    <div class="tile"><div class="v">${fmtMMSS(dur)}</div><div class="l">${A('المدة','duration')}</div></div>
    <div class="tile"><div class="v">${doneSets}/${total}</div><div class="l">${A('سيتات','sets')}</div></div>
    <div class="tile"><div class="v">${r0(vol).toLocaleString('en')}</div><div class="l">${A('حجم كجم×تكرار','volume kg×reps')}</div></div>
  </div>
  ${lg.cardioDone?`<div class="okline">🫀 ${A('الكارديو مكتمل ✓','Cardio done ✓')}</div>`:''}
  <h3 style="margin-top:10px">${A('مقترح الجلسة القادمة','Next-session suggestions')}</h3>
  <table class="mini"><tr><th>${A('التمرين','Exercise')}</th><th>${A('كجم','kg')}</th></tr>${sug}</table>
  <div class="btnrow"><button class="btn primary big" onclick="dlg.close()">${A('تم','Done')}</button></div>`;
  S.sessionActive=null; SES=null;
  save(true); hideSession(); openDlg(h);
}
</script>
<script>
/* ===================== MORE: progress / check-in / settings / sources ===================== */
function renderMore(){
  applyChrome();
  const el=document.getElementById('moreBody');
  document.querySelectorAll('#v-more [data-go]').forEach(b=>b.onclick=()=>{moreSub=b.dataset.go;renderMore();});
  if(moreSub==='progress') el.innerHTML=progressHTML();
  else if(moreSub==='checkin') el.innerHTML=checkinHTML();
  else if(moreSub==='settings') el.innerHTML=settingsHTML();
  else if(moreSub==='sources') el.innerHTML=sourcesHTML();
  else el.innerHTML=`<div class="card"><div class="sub">${A('اختر قسماً من الأعلى. بياناتك كلها محفوظة محلياً على جهازك فقط.','Pick a section above. All your data lives locally on this device only.')}</div></div>`;
}

/* ---------- SVG line chart ---------- */
function lineChart(data, unit, color){
  if(!data.length) return `<div class="sub center" style="padding:18px">${A('لا توجد بيانات بعد — سجل أول قياس من شاشة اليوم.','No data yet — log your first entry from the Today screen.')}</div>`;
  const W=560,H=150,P=28;
  const ys=data.map(d=>d.y);
  let mn=Math.min(...ys), mx=Math.max(...ys); if(mx-mn<1){mx+=0.5;mn-=0.5;}
  const X=i=>P+(W-2*P)*(data.length===1?0.5:i/(data.length-1));
  const Y=v=>H-P-(H-2*P)*((v-mn)/(mx-mn));
  const pts=data.map((d,i)=>X(i)+','+Y(d.y)).join(' ');
  let dots=data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.y)}" r="3.5" fill="${color}"/>`).join('');
  let labels=data.map((d,i)=> (data.length<=10||i%Math.ceil(data.length/8)===0)? `<text x="${X(i)}" y="${H-6}" font-size="9" text-anchor="middle" fill="var(--charttxt)">${d.x}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <text x="4" y="${Y(mx)+4}" font-size="10" fill="var(--charttxt)">${r1(mx)}</text>
    <text x="4" y="${Y(mn)+4}" font-size="10" fill="var(--charttxt)">${r1(mn)}</text>
    <line x1="${P}" y1="${Y(mn)}" x2="${W-P}" y2="${Y(mn)}" stroke="var(--chartaxis)"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labels}
    <text x="${W-4}" y="12" font-size="10" text-anchor="end" fill="var(--charttxt)">${unit}</text>
  </svg>`;
}
function weekAvgWeights(){
  const out=[];
  for(let w=1;w<=4;w++){
    const days=PLAN.filter(d=>d.week===w).map(d=>d.date);
    const ws=S.weights.filter(x=>days.includes(x.date)).map(x=>x.kg);
    if(ws.length) out.push({week:w, avg:r1(ws.reduce((a,b)=>a+b,0)/ws.length), n:ws.length});
  }
  return out;
}
function weekAdherence(w){
  const days=PLAN.filter(d=>d.week===w);
  let train=0, trainDone=0, mealSlots=0, mealDone=0;
  days.forEach(d=>{
    const i=d.idx-1;
    if(d.isTrain){ train++; if(S.workLogs[i]&&S.workLogs[i].status==='done') trainDone++; }
    const ml=S.mealLogs[i]||{};
    SLOT_ORDER.forEach(s=>{ (d.meals.slots[s]||[]).forEach((mi,ix)=>{ if(s==='x')return; mealSlots++; const st=ml[s+'_'+ix]; if(st==='done'||st==='swapped') mealDone++; }); });
  });
  return {train, trainDone, mealPct: mealSlots? r0(100*mealDone/mealSlots):0};
}
function progressHTML(){
  const wa=weekAvgWeights();
  const wData=S.weights.map(x=>({x:x.date.slice(8,10)+'/'+x.date.slice(5,7), y:x.kg}));
  const waistData=S.waists.map(x=>({x:x.date.slice(8,10)+'/'+x.date.slice(5,7), y:x.cm}));
  const bfData=S.bodyFats.map(x=>({x:x.date.slice(8,10)+'/'+x.date.slice(5,7), y:x.pct}));
  let h=`<div class="card"><h2>📈 ${A('التقدم','Progress')}</h2>
  <h3>${A('وزن الجسم (كجم)','Body weight (kg)')}</h3><div class="chartbox">${lineChart(wData,'kg','var(--acc)')}</div>
  ${wa.length?`<div class="grid4" style="margin-top:8px">${wa.map(x=>`<div class="tile"><div class="v">${x.avg}</div><div class="l">${A('متوسط أسبوع ','wk avg ')}${x.week} (${x.n})</div></div>`).join('')}</div>`:''}
  <div class="note">${A('قِس صباحاً بعد الحمام وقبل الأكل. احكم على الاتجاه بمتوسط الأسبوع، وتجاهل تذبذب اليوم الواحد.','Weigh in the morning, after the bathroom, before eating. Judge the weekly average — ignore single-day noise.')}</div>
  <h3 style="margin-top:14px">${A('محيط الخصر (سم)','Waist (cm)')}</h3><div class="chartbox">${lineChart(waistData,'cm','#ffb454')}</div>
  <div class="inrow" style="margin-top:8px">
    <div><label class="f">${A('قياس خصر جديد (سم)','New waist entry (cm)')}</label><input type="number" step="0.5" id="waistIn" placeholder="${A('عند السرة','at the navel')}"></div>
    <div><label class="f">${A('نسبة دهون (من InBody عند إعادة الفحص)','Body-fat % (from InBody retest)')}</label><input type="number" step="0.1" id="bfIn" placeholder="%"></div>
  </div>
  <div class="btnrow"><button class="btn primary" onclick="addMeasure()">${A('إضافة القياسات','Add measurements')}</button></div>
  ${bfData.length?`<h3 style="margin-top:14px">${A('نسبة الدهون %','Body-fat %')}</h3><div class="chartbox">${lineChart(bfData,'%','#7dd3fc')}</div>`:''}
  <h3 style="margin-top:14px">${A('الالتزام الأسبوعي','Weekly adherence')}</h3>`;
  for(let w=1;w<=4;w++){ const a=weekAdherence(w);
    const cN=PLAN.filter(d=>d.week===w&&isCancelled(d.idx-1)).length;
    h+=`<div style="margin:8px 0"><b class="sub" style="color:var(--ink)">${A('أسبوع','Week')} ${w}</b>
    <div class="sub">${A('تمارين: ','Workouts: ')}${a.trainDone}/${a.train}${cN?` (${cN} ${A('ملغى بتعويض','cancelled w/ make-up')})`:''} • ${A('وجبات: ','meals: ')}${a.mealPct}%</div>
    <div class="progressbar g"><i style="width:${a.train? r0(100*a.trainDone/a.train):0}%"></i></div></div>`; }
  h+=`</div>`;
  return h;
}
function addMeasure(){
  const today=new Date().toISOString().slice(0,10);
  const wv=parseFloat(document.getElementById('waistIn').value);
  const bf=parseFloat(document.getElementById('bfIn').value);
  if(wv&&wv>40&&wv<200){ S.waists.push({date:today,cm:wv}); S.waists.sort((a,b)=>a.date<b.date?-1:1); }
  if(bf&&bf>3&&bf<60){ S.bodyFats.push({date:today,pct:bf}); S.bodyFats.sort((a,b)=>a.date<b.date?-1:1); }
  save(true); renderMore();
}

/* ---------- Check-in ---------- */
function checkinHTML(){
  const wa=weekAvgWeights();
  let h=`<div class="card"><h2>📝 ${A('التشيك-إن الأسبوعي','Weekly Check-in')}</h2>
  <div class="sub">${A('عبئه نهاية كل أسبوع (الجمعة أو السبت). التوصيات تُبنى على متوسطات الأسبوع كاملاً، لا على يوم واحد.','Fill it at week end (Fri/Sat). Recommendations use full-week averages, never a single day.')}</div>
  <label class="f">${A('الأسبوع','Week')}</label><select id="ciWeek">${[1,2,3,4].map(w=>`<option value="${w}">${A('أسبوع','Week')} ${w}</option>`).join('')}</select>
  <div class="inrow">
    <div><label class="f">${A('متوسط وزن الصباح (كجم)','Avg morning weight (kg)')}</label><input type="number" step="0.1" id="ciW" placeholder="${wa.length? A('آخر متوسط: ','last avg: ')+wa[wa.length-1].avg:'—'}"></div>
    <div><label class="f">${A('الخصر (سم)','Waist (cm)')}</label><input type="number" step="0.5" id="ciWaist"></div>
  </div>
  <div class="inrow3">
    <div><label class="f">${A('الجوع (1-5)','Hunger (1-5)')}</label><select id="ciHunger">${[1,2,3,4,5].map(x=>`<option ${x===3?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label class="f">${A('الطاقة (1-5)','Energy (1-5)')}</label><select id="ciEnergy">${[1,2,3,4,5].map(x=>`<option ${x===3?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label class="f">${A('النوم (1-5)','Sleep (1-5)')}</label><select id="ciSleep">${[1,2,3,4,5].map(x=>`<option ${x===3?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>
  <label class="f">${A('ألم أو مشكلة استشفاء؟','Pain or recovery issue?')}</label><input type="text" id="ciPain" placeholder="${A('مثال: انزعاج بسيط في المرفق مع البريتشر','e.g. mild elbow discomfort on preacher curls')}">
  <label class="f">${A('ملاحظات','Notes')}</label><input type="text" id="ciNotes">
  <div class="btnrow"><button class="btn primary big" onclick="runCheckin()">${A('حلّل الأسبوع وأعطني التوصيات','Analyze the week & give recommendations')}</button></div></div>`;
  S.checkins.slice().reverse().forEach(c=>{
    h+=`<div class="card flat"><h3>${A('نتيجة أسبوع','Week result')} ${c.week} <span class="sub">(${fmtTime(c.date)})</span></h3>
    <div class="sub">${A('متوسط الوزن: ','Avg weight: ')}${c.avgW||'—'} • ${A('تمارين','workouts')} ${c.done} • ${A('التزام وجبات','meal adherence')} ${c.adherence}% • ${A('جوع','hunger')} ${c.hunger} • ${A('طاقة','energy')} ${c.energy} • ${A('نوم','sleep')} ${c.sleep}</div>
    <div class="note" style="white-space:pre-line">${esc(c.reco)}</div></div>`;
  });
  return h;
}
function runCheckin(){
  const week=+document.getElementById('ciWeek').value;
  const a=weekAdherence(week);
  const avgW=parseFloat(document.getElementById('ciW').value)||null;
  const waist=parseFloat(document.getElementById('ciWaist').value)||null;
  const hunger=+document.getElementById('ciHunger').value, energy=+document.getElementById('ciEnergy').value, sleep=+document.getElementById('ciSleep').value;
  const pain=document.getElementById('ciPain').value.trim(), notes=document.getElementById('ciNotes').value.trim();
  if(waist){ S.waists.push({date:new Date().toISOString().slice(0,10),cm:waist}); }
  const prev=S.checkins.filter(c=>c.week===week-1).pop();
  const prevW=prev?prev.avgW:(S.profile.weightKg||null);
  let lines=[];
  let lossPct=null;
  if(avgW&&prevW){ lossPct=r1(100*(prevW-avgW)/prevW); lines.push(A(`التغير الأسبوعي: ${lossPct>0?'-':'+'}${Math.abs(lossPct)}% (${r1(prevW-avgW)} كجم).`,`Weekly change: ${lossPct>0?'-':'+'}${Math.abs(lossPct)}% (${r1(prevW-avgW)} kg).`)); }
  if(a.mealPct<75 || a.trainDone<a.train-1){
    lines.push(A('الأولوية القادمة: الالتزام قبل أي تعديل — ثبّت الخطة كما هي وحقق ≥80% أسبوعاً كاملاً.','Priority: adherence before any adjustment — keep the plan as-is and hit ≥80% for a full week.'));
  } else if(lossPct!=null){
    if(lossPct>1.2 && (hunger>=4||energy<=2)) lines.push(A('النزول أسرع من اللازم مع جوع/إرهاق: أضف سناك الجوع يومياً (+150-200 kcal) وراقب أسبوعاً.','Losing too fast with hunger/fatigue: add the flex snack daily (+150-200 kcal) and watch for a week.'));
    else if(lossPct>=0.4) lines.push(A('معدل النزول ممتاز (0.4-1.2%): لا تغيّر شيئاً — كرر نفس الأسبوع.','Rate of loss is ideal (0.4-1.2%): change nothing — repeat the week.'));
    else if(week>=2) lines.push(A('النزول أبطأ من الهدف مع التزام جيد: احذف «سناك الجوع» في أيام الراحة أو ارفع الخطوات إلى 11 ألفاً — خياراً واحداً فقط.','Loss slower than target with good adherence: drop the flex snack on rest days OR raise steps to 11k — pick one, not both.'));
    else lines.push(A('أسبوع أول: لا تستعجل الحكم — الماء والجلايكوجين يخفيان النتيجة. استمر.','Week 1: don\'t judge yet — water and glycogen mask the result. Keep going.'));
  }
  if(hunger>=4&&lossPct!=null&&lossPct<=1.2) lines.push(A('لإدارة الجوع: قدّم العشاء، أضف سلطة خضراء/فت زيرو (سعرات شبه صفرية)، ونم مبكراً.','For hunger: eat dinner earlier, add a green salad/Fit Zero (near-zero kcal), sleep earlier.'));
  if(energy<=2||sleep<=2) lines.push(A('طاقة/نوم منخفض: ثبّت موعد النوم (7-8 ساعات)، وخفف الكارديو الختامي إلى 10 دقائق هذا الأسبوع.','Low energy/sleep: fix your bedtime (7-8h) and cut finishing cardio to 10 min this week.')+(week===4? A(' فعّل الديلود: احذف السيت الأخير من تمارين العزل.',' Activate the deload: drop the last set of isolation lifts.'):''));
  if(pain) lines.push(A('الألم ('+pain+'): بدّل التمرين المسبب بالبديل المذكور وخفف وزنه 10-15%. إذا استمر أسبوعين أو كان حاداً راجع أخصائي علاج طبيعي.','Pain ('+pain+'): swap the offending exercise for its listed alternative and drop its load 10-15%. If it persists 2 weeks or is sharp, see a physio.'));
  if(waist) lines.push(A('الخصر مسجل — راقب الاتجاه عبر 2-3 أسابيع مع متوسط الوزن معاً.','Waist logged — track the trend over 2-3 weeks together with average weight.'));
  if(!lines.length) lines.push(A('استمر على نفس الخطة وسجل بياناتك يومياً.','Stay the course and log daily.'));
  const reco='• '+lines.join('\n• ');

}

function saveProfile(){
  const p=S.profile;
  const g=id=>document.getElementById(id).value;
  const num=(id)=>{const v=parseFloat(g(id)); return isNaN(v)?null:v;};
  p.weightKg=num('pW')||p.weightKg; p.heightCm=num('pH')||p.heightCm; p.age=num('pA')||p.age;
  p.smm=num('pSMM'); p.bfm=num('pBFM'); p.pbf=num('pPBF'); p.bmi=num('pBMI'); p.visceral=num('pVis');
  p.bmr=num('pBMR'); p.inbodyScore=num('pScore'); p.inbodyDate=g('pDate');
  p.activityFactor=parseFloat(g('pAct')); p.deficit=parseInt(g('pDef'));
  if(p.inbodyDate) p.estimated=false;
  if(p.pbf!=null){ S.bodyFats.push({date:p.inbodyDate||new Date().toISOString().slice(0,10), pct:p.pbf}); }
  save(true); renderMore(); toast(A('أُعيد حساب الأهداف ✓','Targets recalculated ✓'));
}
function exportBackup(){
  const data=JSON.stringify(S,null,1);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='mohanad-fitness-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast(A('نُزلت النسخة الاحتياطية','Backup downloaded'));
}
function importBackup(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d || typeof d!=='object' || d.v!==SCHEMA_V) throw 0;
      const clean=DEFAULT_STATE();
      ['profile','settings','workLogs','mealLogs','stepsLog','cancels','comps'].forEach(k=>{ if(d[k]&&typeof d[k]==='object') clean[k]=d[k]; });
      ['weights','waists','bodyFats','checkins'].forEach(k=>{ if(Array.isArray(d[k])) clean[k]=d[k]; });
      if(Array.isArray(d.dayShift)&&d.dayShift.length===28) clean.dayShift=d.dayShift.map(x=>Math.max(0,parseInt(x)||0));
      clean.onboarded=!!d.onboarded;
      S=clean;
      S.settings=Object.assign({sound:true,vibrate:true,autoRest:true,lang:'en',theme:'auto',restSec:60}, S.settings||{});
      save(true); applyChrome(); render(); toast(A('استُعيدت النسخة ✓','Backup restored ✓'));
    }catch(e){ toast(A('ملف غير صالح — تأكد أنه نسخة من هذا التطبيق','Invalid file — make sure it\'s a backup from this app')); }
  };
  rd.readAsText(f);
}
function confirmReset(){
  openDlg(`<h3>⚠️ ${A('مسح كل البيانات؟','Erase all data?')}</h3><p class="sub">${A('سيُحذف كل شيء: السجلات، الأوزان، التشيك-إن، الإعدادات. لا تراجع بعدها. صدّر نسخة احتياطية أولاً.','Everything will be deleted: logs, weights, check-ins, settings. No undo. Export a backup first.')}</p>
  <div class="btnrow"><button class="btn danger" onclick="S=DEFAULT_STATE();save(true);dlg.close();applyChrome();showView('today');toast(A('تم المسح','Erased'))">${A('نعم، امسح كل شيء','Yes, erase everything')}</button>
  <button class="btn primary" onclick="dlg.close()">${A('تراجع','Back')}</button></div>`);
}
