<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c09">
<title>خطة مهند — 4 أسابيع | BUILD YOUR BEST SELF</title>
<style>
/* ===== Theme: IRONCORE dark + volt green — from reference image ===== */
:root{
  --bg1:#0b0c09; --bg2:#121410; --card:#161814; --card2:#1b1e19; --ink:#f2f4ec; --ink2:#9aa091;
  --line:#272b23; --soft:#1e211b; --dark:#c8f135; --dark2:#20241d;
  --volt:#c8f135; --voltink:#10130a; --voltdim:#8fae26;
  --ok:#c8f135; --okbg:#222a12; --warn:#ffb454; --warnbg:#2a2113; --bad:#ff6f61; --badbg:#2b1512;
  --acc:#c8f135; --r:18px; --shadow:0 12px 30px rgba(0,0,0,.5);
  --font:'SF Arabic','Segoe UI','Helvetica Neue',Tahoma,'Noto Naskh Arabic UI',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--font); color:var(--ink); background:var(--bg1);
  min-height:100vh; font-size:15.5px; line-height:1.55;
}
body::before{ /* volt glow like the reference hero */
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(600px 300px at 85% -5%, rgba(200,241,53,.10), transparent 60%),
    radial-gradient(500px 320px at -10% 30%, rgba(200,241,53,.05), transparent 60%),
    linear-gradient(165deg,var(--bg2),var(--bg1) 60%);
}
#app{max-width:980px; margin:0 auto; padding:14px 14px 90px}
/* ===== Typography ===== */
h1,h2,h3{margin:.2em 0 .35em; line-height:1.25}
.display{
  font-weight:900; letter-spacing:.5px; text-transform:uppercase;
  font-size:clamp(26px,6vw,40px); color:var(--ink);
}
.display .ghost{color:var(--volt); text-shadow:0 0 24px rgba(200,241,53,.35)}
.en-tag{ /* volt eyebrow label like STRONGER EVERYDAY */
  display:inline-block; direction:ltr; font-weight:800; letter-spacing:3px; font-size:11px;
  text-transform:uppercase; color:var(--volt);
}
.sub{color:var(--ink2); font-size:13.5px}
/* ===== Header ===== */
header.top{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 10px}
.brand{display:flex; flex-direction:column; gap:2px}
.brand b{font-size:19px; font-weight:900; color:var(--ink)}
.savebox{display:flex; align-items:center; gap:8px}
.savedot{font-size:11px; color:var(--ink2); text-align:left; direction:ltr}
/* ===== Cards ===== */
.card{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; margin:12px 0; border:1px solid var(--line)}
.card.flat{box-shadow:none; border:1px solid var(--line)}
.card h2{font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px; color:var(--ink)}
.card h3{font-size:15.5px; font-weight:800; color:var(--ink)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
@media(max-width:560px){.grid4{grid-template-columns:repeat(2,1fr)} .grid3{grid-template-columns:1fr 1fr}}
/* ===== Buttons ===== */
.btn{
  appearance:none; border:0; cursor:pointer; font-family:inherit; font-weight:800; font-size:15px;
  border-radius:14px; padding:12px 18px; background:var(--soft); color:var(--ink);
  transition:transform .06s ease, box-shadow .15s ease, background .15s, filter .15s; user-select:none;
  border:1px solid var(--line);
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--volt); color:var(--voltink); border-color:var(--volt); box-shadow:0 8px 24px rgba(200,241,53,.25)}
.btn.primary:active{filter:brightness(.92)}
.btn.big{width:100%; padding:16px; font-size:18px; border-radius:16px}
.btn.ok{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
.btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink2)}
.btn.danger{background:var(--badbg); color:var(--bad); border-color:#3a201c}
.btn.small{padding:7px 12px; font-size:13px; border-radius:10px}
.btn[disabled]{opacity:.45; pointer-events:none}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
/* ===== Chips / badges ===== */
.chip{display:inline-flex; align-items:center; gap:5px; background:var(--soft); border:1px solid var(--line); border-radius:99px; padding:3px 10px; font-size:12px; font-weight:700; color:var(--ink2)}
.chip.dark{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
.chip.ok{background:var(--okbg); color:var(--volt); border-color:transparent}
.chip.warn{background:var(--warnbg); color:var(--warn); border-color:transparent}
.chip.spicy{background:#2b1512; color:#ff8a7a; border-color:transparent}
.tg{background:var(--volt); color:var(--voltink); font-size:10.5px; letter-spacing:.8px; direction:ltr; border-radius:6px; padding:2px 7px; font-weight:900; display:inline-block}
/* ===== Nav (bottom) ===== */
nav.tabs{
  position:fixed; bottom:0; right:0; left:0; z-index:50; display:flex; justify-content:space-around;
  background:rgba(14,16,12,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button{
  flex:1; max-width:120px; border:0; background:none; font-family:inherit; cursor:pointer; padding:6px 2px;
  display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink2); font-size:11px; font-weight:800; border-radius:12px;
}
nav.tabs button .ic{font-size:19px; line-height:1; filter:grayscale(.4)}
nav.tabs button.active{color:var(--volt)}
nav.tabs button.active .ic{transform:translateY(-1px); filter:none}
nav.tabs button.active::after{content:""; width:18px; height:3px; border-radius:3px; background:var(--volt); margin-top:1px}
/* ===== Sections ===== */
.view{display:none; animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
/* ===== Stats tiles ===== */
.tile{background:var(--card2); border-radius:14px; padding:10px 12px; border:1px solid var(--line); text-align:center}
.tile .v{font-size:20px; font-weight:900; direction:ltr; color:var(--volt)}
.tile .l{font-size:11px; color:var(--ink2); font-weight:700}
/* ===== Exercise rows ===== */
.exrow{border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:8px 0; background:var(--card2)}
.exrow .t{display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer}
.exrow .t b{font-size:14.5px; color:var(--ink)}
.exrow .meta{font-size:12.5px; color:var(--ink2); margin-top:2px}
.exrow .body{display:none; border-top:1px dashed var(--line); margin-top:9px; padding-top:9px; font-size:13.5px}
.exrow.open{border-color:rgba(200,241,53,.35)}
.exrow.open .body{display:block}
.done-x{color:var(--volt); font-weight:900}
/* ===== Tables ===== */
table.mini{width:100%; border-collapse:collapse; font-size:13px}
table.mini th{font-size:11.5px; color:var(--ink2); font-weight:800; padding:5px 6px; border-bottom:1px solid var(--line); text-align:right}
table.mini td{padding:6px; border-bottom:1px solid var(--soft); text-align:right; color:var(--ink)}
table.mini td.num{direction:ltr; text-align:left; font-weight:700; color:var(--ink)}
/* ===== Inputs ===== */
input[type=number],input[type=text],input[type=date],select,textarea{
  width:100%; font-family:inherit; font-size:15px; padding:10px 12px; border:1.5px solid var(--line);
  border-radius:12px; background:var(--card2); color:var(--ink); outline:none; color-scheme:dark;
}
input:focus,select:focus,textarea:focus{border-color:var(--volt)}
input::placeholder{color:#666c60}
label.f{display:block; font-size:12.5px; font-weight:800; color:var(--ink2); margin:8px 0 4px}
.inrow{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.inrow3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
/* toggle */
.tgl{position:relative; width:46px; height:26px; flex:none}
.tgl input{opacity:0; width:0; height:0}
.tgl span{position:absolute; inset:0; background:#2b2f27; border-radius:99px; transition:.18s; cursor:pointer}
.tgl span::before{content:""; position:absolute; width:20px; height:20px; border-radius:50%; background:#e8ebe0; top:3px; right:3px; transition:.18s; box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tgl input:checked + span{background:var(--volt)}
.tgl input:checked + span::before{transform:translateX(-20px); background:var(--voltink)}
.setline{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--soft); color:var(--ink)}
/* ===== Session (workout mode) ===== */
#sessionOverlay{
  position:fixed; inset:0; z-index:100; color:#fff;
  background:
    radial-gradient(500px 260px at 90% -4%, rgba(200,241,53,.12), transparent 60%),
    linear-gradient(165deg,#101208,#0a0b08 60%);
  display:none; flex-direction:column; overflow-y:auto; padding:14px 14px 26px;
}
#sessionOverlay.on{display:flex}
#sessionOverlay .shead{display:flex; justify-content:space-between; align-items:center; gap:8px}
#sessionOverlay .stime{direction:ltr; font-weight:900; font-size:15px; color:var(--volt)}
.scard{background:rgba(255,255,255,.05); border:1px solid rgba(200,241,53,.16); border-radius:16px; padding:14px; margin:10px 0}
.scard h3{color:#fff}
.snum{direction:ltr; font-weight:900}
.bigtimer{
  text-align:center; font-weight:900; font-size:64px; direction:ltr; letter-spacing:2px; line-height:1;
  font-variant-numeric:tabular-nums; margin:4px 0;
}
.resting .bigtimer{color:var(--volt); text-shadow:0 0 30px rgba(200,241,53,.35)}
.restdone{animation:pulse .6s ease 4}
@keyframes pulse{0%,100%{background:rgba(200,241,53,.08)}50%{background:rgba(200,241,53,.35)}}
.sbtn{background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18)}
.sbtn.primary{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
.sgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
.sgrid .f{color:#aeb2a4}
#sessionOverlay input{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.2); color:#fff; text-align:center; direction:ltr; font-weight:800}
.setdots{display:flex; gap:6px; margin:6px 0}
.setdots i{width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.18)}
.setdots i.d{background:var(--volt)}
.setdots i.cur{outline:2px solid #fff; outline-offset:2px}
/* ===== Meals ===== */
.meal{border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:8px 0; background:var(--card2)}
.meal b{color:var(--ink)}
.meal .mt{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
.meal .macro{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.mtag{font-size:11px; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:2px 8px; font-weight:800; color:var(--ink2); direction:ltr}
.mtag.w{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
/* ===== Calendar ===== */
.wkband{display:flex; gap:6px; overflow-x:auto; padding:4px 0; scrollbar-width:none}
.wkband::-webkit-scrollbar{display:none}
.dayb{flex:none; width:64px; border:1.5px solid var(--line); background:var(--card2); border-radius:14px; padding:8px 4px; text-align:center; cursor:pointer; font-family:inherit; color:var(--ink)}
.dayb small{display:block; font-size:10px; color:var(--ink2); font-weight:700}
.dayb b{font-size:15px}
.dayb.today{border-color:var(--volt); box-shadow:0 0 14px rgba(200,241,53,.22)}
.dayb.selected{background:var(--volt); color:var(--voltink); border-color:var(--volt)}
.dayb.selected small{color:#3c4517}
.dayb .st{font-size:10px; font-weight:800}
.dayb .st.done{color:var(--volt)}
.dayb.selected .st.done{color:var(--voltink)}
/* ===== Progress charts ===== */
.chartbox{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:10px}
svg.chart{width:100%; height:150px; display:block; direction:ltr}
/* ===== Misc ===== */
.hr{height:1px; background:var(--line); margin:12px 0}
.note{font-size:12.5px; color:var(--ink2); background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-top:8px}
.warnnote{font-size:12.5px; color:var(--warn); background:var(--warnbg); border:1px solid #3a2c14; border-radius:10px; padding:8px 10px; margin-top:8px}
.okline{color:var(--volt); font-weight:800}
a.ext{color:var(--volt); font-weight:800; text-decoration:underline; text-underline-offset:3px}
.center{text-align:center}
.mut{color:var(--ink2)}
.spacer{height:8px}
.progressbar{height:8px; background:var(--soft); border-radius:99px; overflow:hidden}
.progressbar i{display:block; height:100%; background:var(--volt); border-radius:99px; transition:width .3s}
.progressbar.g i{background:var(--volt)}
dialog{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:18px; padding:0; max-width:480px; width:92vw; box-shadow:0 24px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,6,4,.65); backdrop-filter:blur(3px)}
.dlgin{padding:18px}
.toast{
  position:fixed; bottom:84px; right:50%; transform:translateX(50%); background:var(--volt); color:var(--voltink);
  padding:10px 18px; border-radius:99px; font-weight:800; font-size:13.5px; z-index:200; box-shadow:0 10px 28px rgba(200,241,53,.3);
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.toast.on{opacity:1}
.offlinebanner{background:var(--warnbg); color:var(--warn); font-size:12.5px; font-weight:700; border-radius:12px; padding:8px 12px; margin:8px 0; display:none}
@media print{nav.tabs,#startFab{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="en-tag">GET MOVING</span>
      <b>خطة مهند — ٤ أسابيع</b>
      <span class="savedot" id="savedAt">—</span>
    </div>
    <div class="savebox">
      <button class="btn small" id="btnManualSave">حفظ</button>
    </div>
  </header>

  <div class="offlinebanner" id="storageWarn">⚠️ التخزين المحلي غير متاح في هذا العرض (وضع معاينة). افتح الملف مباشرة في متصفحك حتى تُحفظ بياناتك.</div>

  <!-- ============ TODAY ============ -->
  <section class="view" id="v-today"></section>

  <!-- ============ CALENDAR / PLAN ============ -->
  <section class="view" id="v-plan"></section>

  <!-- ============ MEALS ============ -->
  <section class="view" id="v-meals"></section>

  <!-- ============ LIBRARY ============ -->
  <section class="view" id="v-lib"></section>

  <!-- ============ MORE (progress / check-in / settings / sources) ============ -->
  <section class="view" id="v-more">
    <div class="card">
      <h2>المزيد</h2>
      <div class="grid2">
        <button class="btn" data-go="progress">📈 التقدم</button>
        <button class="btn" data-go="checkin">📝 التشيك-إن الأسبوعي</button>
        <button class="btn" onclick="showView('lib')">🏋️ مكتبة التمارين</button>
        <button class="btn" data-go="settings">⚙️ الإعدادات والبيانات</button>
        <button class="btn" data-go="sources">📚 المصادر والمنهجية</button>
      </div>
    </div>
    <div id="moreBody"></div>
  </section>

  <div class="spacer"></div>
</div>

<!-- ============ WORKOUT SESSION OVERLAY ============ -->
<div id="sessionOverlay"></div>

<!-- Rest-complete audio is generated via WebAudio (no external files). -->

<div class="toast" id="toast"></div>

<dialog id="dlg"><div class="dlgin" id="dlgBody"></div></dialog>

<nav class="tabs" id="tabs">
  <button data-view="today" class="active"><span class="ic">🏠</span>اليوم</button>
  <button data-view="workout" id="tabWorkout"><span class="ic">🏋️</span>التمرين</button>
  <button data-view="plan"><span class="ic">📅</span>الخطة</button>
  <button data-view="meals"><span class="ic">🍽️</span>الوجبات</button>
  <button data-view="more"><span class="ic">☰</span>المزيد</button>
</nav>
<script>
/* =====================================================================
   DATA — menu (وجبات اللياقة TFM, extracted from official menu qrco.de/bbeE4R
   on 01/08/2026), Technogym exercise library, 28-day plan
   ===================================================================== */
'use strict';

/* ---------- TFM menu: macros as printed. scope:'protein' = القيم للمصدر البروتيني فقط،
   scope:'full' = القيم لكامل الطبق (كما هو مطبوع في المنيو) ---------- */
const MENU = {
  /* وجبات الدجاج */
  tika:{ar:'دجاج فت تكا',en:'Fit Tikka Chicken',cat:'chicken',price:26,kcal:205,p:39,f:5,c:1,scope:'protein',best:1},
  kotshi:{ar:'دجاج فت كوتشي',en:'Fit Kotchi Chicken',cat:'chicken',price:26,kcal:196.5,p:37,f:4.5,c:2,scope:'protein',best:1},
  mashwi:{ar:'دجاج فت المشوي',en:'Fit Grilled Chicken',cat:'chicken',price:26,kcal:163.5,p:32,f:3.5,c:1,scope:'protein',best:1},
  dragon:{ar:'دجاج فت دراقون',en:'Fit Dragon Chicken',cat:'chicken',price:26,kcal:206,p:34,f:6,c:4,scope:'protein',spicy:1,best:1},
  shish:{ar:'دجاج فت شيش',en:'Fit Shish Chicken',cat:'chicken',price:26,kcal:201,p:37,f:5,c:2,scope:'protein',spicy:1},
  fajitaCh:{ar:'دجاج فت فاهيتا',en:'Fit Fajita Chicken',cat:'chicken',price:26,kcal:200.5,p:38,f:4.5,c:2,scope:'protein'},
  bbqCh:{ar:'دجاج فت باربكيو',en:'Fit BBQ Chicken',cat:'chicken',price:26,kcal:209,p:35,f:5,c:6,scope:'protein'},
  mongolianCh:{ar:'دجاج فت منقولين',en:'Fit Mongolian Chicken',cat:'chicken',price:26,kcal:209,p:35,f:5,c:6,scope:'protein',soy:1},
  samurai:{ar:'دجاج فت ساموراي',en:'Fit Samurai Chicken',cat:'chicken',price:26,kcal:198,p:34,f:6,c:2,scope:'protein',sesame:1},
  masala:{ar:'دجاج فت ماسالا',en:'Fit Masala Chicken',cat:'chicken',price:26,kcal:235,p:39,f:7,c:4,scope:'protein',spicy:1,best:1},
  curry:{ar:'دجاج فت كاري',en:'Fit Curry Chicken',cat:'chicken',price:26,kcal:226,p:39,f:6,c:4,scope:'protein',milk:1,spicy:1},
  mushCh:{ar:'دجاج فت الفطر',en:'Fit Mushroom Chicken',cat:'chicken',price:26,kcal:230,p:39,f:6,c:5,scope:'protein',milk:1},
  asian:{ar:'دجاج فت اسيوي',en:'Fit Asian Chicken',cat:'chicken',price:26,kcal:218,p:39,f:6,c:5,scope:'protein',spicy:1},
  okra:{ar:'دجاج فت بامية',en:'Fit Okra Chicken',cat:'chicken',price:27,kcal:180,p:25,f:4.5,c:10,scope:'protein',note:'100غ بامية + 100غ دجاج'},
  molokh:{ar:'دجاج فت ملوخية',en:'Fit Molokhia Chicken',cat:'chicken',price:27,kcal:211.5,p:37,f:3.5,c:8,scope:'protein'},
  /* وجبات اللحم */
  steakBeef:{ar:'فت ستيك بيف',en:'Fit Beef Steak',cat:'beef',price:40,kcal:197,p:36,f:5,c:2,scope:'protein'},
  steakDeBeef:{ar:'فت ستيك دي بيف',en:'Fit Steak de Beef',cat:'beef',price:40,kcal:227,p:37,f:7,c:4,scope:'protein'},
  mongolianBeef:{ar:'فت منقولين بيف',en:'Fit Mongolian Beef',cat:'beef',price:38,kcal:223,p:36,f:7,c:4,scope:'protein',soy:1,best:1},
  chiliBeef:{ar:'فت تشيلي بيف',en:'Fit Chili Beef',cat:'beef',price:38,kcal:230,p:36,f:6,c:8,scope:'protein',spicy:1,best:1},
  meatballs:{ar:'فت كرات اللحم',en:'Fit Meatballs',cat:'beef',price:38,kcal:240,p:38,f:8,c:4,scope:'protein'},
  /* المأكولات البحرية */
  salmon:{ar:'فت سالمون',en:'Fit Salmon',cat:'seafood',price:44,kcal:207,p:36,f:7,c:0,scope:'protein',best:1},
  shrimpG:{ar:'فت الروبيان المشوي',en:'Fit Grilled Shrimp',cat:'seafood',price:44,kcal:101,p:20,f:1.5,c:2,scope:'protein'},
  sweetShrimp:{ar:'فت سويت شريمب',en:'Fit Sweet Shrimp',cat:'seafood',price:44,kcal:114,p:21,f:2.5,c:2,scope:'protein',spicy:1},
  fishFillet:{ar:'فت سمك الفيلة',en:'Fit Fish Fillet',cat:'seafood',price:30,kcal:141,p:33,f:1,c:0,scope:'protein'},
  /* باستا (كامل الطبق) */

function buildPlan(){
  const days=[]; const start=new Date(PLAN_START+'T00:00:00');
  for(let i=0;i<28;i++){
    const dt=new Date(start.getTime()+i*86400000);
    const w=Math.floor(i/7), dow=i%7; // 0=أحد
    const wk=DAY_TEMPLATE[dow];
    const isTrain=['push','pull','legs','arms','upper'].includes(wk);
    days.push({
      idx:i+1, date:dt.toISOString().slice(0,10), dow, dayName:DAY_AR[dow],
      week:w+1, phase:WEEK_PHASES[w], workout:wk, isTrain,
      meals:MEAL_CYCLE[i%14],
      steps: w<2 ? 8000 : 10000,
      waterL: isTrain? 3.0 : 2.5,
      sleepH:'7-8'
    });
  }
  return days;
}

function calcTargets(p){
  const bmr = p.bmr && p.bmr>800 ? p.bmr : Math.round(10*p.weightKg + 6.25*p.heightCm - 5*p.age + 5);
  const tdee = Math.round(bmr * (p.activityFactor||1.45));
  const kcalTrain = Math.max(1500, Math.round((tdee - (p.deficit||650))/25)*25);
  const kcalRest = Math.max(1350, kcalTrain-200);
  let protein = Math.round(p.weightKg*2.0/5)*5; protein=Math.min(Math.max(protein, Math.round(p.weightKg*1.6)), Math.round(p.weightKg*2.4));
  return {bmr, tdee, kcalTrain, kcalRest, protein};
}

/* حساب ماكروز وجبات يوم */
function mealItemMacros(mi){
  const m=MENU[mi.id]; if(!m) return {kcal:0,p:0,f:0,c:0,ar:'?'};
  /* حصة البروتين القياسية في المنيو = 100 جرام (مثبتة في بطاقة البامية «100ق دجاج»
     ومطابقة لقيم صدر الدجاج المشوي القياسية) — mi.g يحدد الوزن المطلوب بالجرام */
  const mult = (mi.g && m.scope==='protein') ? mi.g/100 : (mi.dbl?2:1);
  return {kcal:m.kcal*mult, p:m.p*mult, f:m.f*mult, c:m.c*mult};
}
function dayMealTotals(mealDay, includeFlex){
  let t={kcal:0,p:0,f:0,c:0};
  SLOT_ORDER.forEach(s=>{
    if(s==='x'&&!includeFlex) return;
    (mealDay.slots[s]||[]).forEach(mi=>{const mm=mealItemMacros(mi); t.kcal+=mm.kcal;t.p+=mm.p;t.f+=mm.f;t.c+=mm.c;});
  });
  return t;
}

function snapDb(w){ let best=DB_WEIGHTS[0]; for(const x of DB_WEIGHTS){ if(Math.abs(x-w)<Math.abs(best-w)) best=x; } return best; }

/* ===================== Helpers & schedule engine ===================== */
function daysSinceStart(){
  const start=new Date(PLAN_START+'T00:00:00'); const now=new Date();
  return Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - start)/86400000);
}
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function effOffset(i){ return i + (S.dayShift[i]||0); }
function effDate(i){ return addDays(PLAN_START, effOffset(i)); }
function totalShift(){ return S.dayShift[27]||0; }
function calDate(c){ return addDays(PLAN_START, c); }
/* c = يوم تقويمي منذ البداية → أي يوم أساس يقع عليه؟ */
function baseForCal(c){
  for(let i=0;i<28;i++){ if(effOffset(i)===c) return i; if(effOffset(i)>c) return null; }
  return null;
}
function todayCal(){ return Math.min(Math.max(daysSinceStart(),0), 27+totalShift()); }
/* حل حالة اليوم: {kind:'day', i} | {kind:'gap', next} */
function resolveCal(c){
  const i=baseForCal(c);
  if(i!=null) return {kind:'day', i};
  let next=null; for(let j=0;j<28;j++){ if(effOffset(j)>c){ next=j; break; } }
  return {kind:'gap', next};
}
function mealsForCal(c){ return MEAL_CYCLE[((c%14)+14)%14]; }
function planDay(i){ return PLAN[i]; }
function isCancelled(i){ return !!S.cancels[i]; }

/* أجّل: هذا اليوم وكل ما بعده يتأخر يوماً واحداً */
function postponeDay(i){
  for(let j=i;j<28;j++) S.dayShift[j]=(S.dayShift[j]||0)+1;
  S.lastPostpone=i;
  save(true); toast('تم التأجيل — تمرين اليوم انتقل إلى '+fmtDateAr(effDate(i)));
  render();
}
function undoPostpone(){
  const i=S.lastPostpone; if(i==null) return;
  for(let j=i;j<28;j++) S.dayShift[j]=Math.max(0,(S.dayShift[j]||0)-1);
  S.lastPostpone=null; save(true); render();
}
/* ألغِ: اليوم يسقط (لا يُحسب تمريناً) ويُضاف تعويض لأقرب جلسة مناسبة */
function cancelDay(i){
  S.cancels[i]=true;
  const okTypes=COMP_OK[PLAN[i].workout]||[];
  for(let j=i+1;j<28;j++){
    if(PLAN[j].isTrain && !isCancelled(j) && okTypes.includes(PLAN[j].workout)){
      S.comps[j]={from:i, workout:PLAN[i].workout}; break;
    }
  }
  save(true); toast('أُلغي اليوم — أُضيفت سيتات تعويض للجلسة المناسبة القادمة'); render();
}
function uncancelDay(i){
  delete S.cancels[i];
  for(const j in S.comps){ if(S.comps[j].from===i) delete S.comps[j]; }
  save(true); render();
}

  <div class="btnrow"><button class="btn primary" onclick="dlg.close();postponeDay(${i})">نعم، أجّل</button>
  <button class="btn ghost" onclick="dlg.close()">تراجع</button></div>`);
}
function confirmCancel(i){

  <div class="btnrow"><button class="btn danger" onclick="dlg.close();cancelDay(${i})">ألغِ اليوم</button>

}

function dayManageHTML(i, dark){

function lastPerf(exId, beforeIdx){
  for(let i=(beforeIdx==null?27:beforeIdx-1); i>=0; i--){

  }

function suggestLoad(exId, dayI){
  const ex=EX[exId];
  if(ex.cardio||ex.load==='time'||ex.load==='body') return null;
  const prev=lastPerf(exId, dayI);
  if(!prev){ return {lo:ex.start[0], hi:ex.start[1], why:'وزن بداية تحفظي — عايره في أول جلسة (احتياطي 3-4 تكرارات)'}; }
  const done=prev.sets.filter(s=>!s.skip && s.w!=null);
  if(!done.length) return {lo:ex.start[0], hi:ex.start[1], why:'لا يوجد سجل مكتمل — ابدأ من نطاق البداية'};
  const maxW=Math.max(...done.map(s=>+s.w||0));
  const pain=done.some(s=>s.pain);
  const avgRIR=done.reduce((a,s)=>a+(s.rir==null?2:+s.rir),0)/done.length;
  const block=findBlock(exId); const topReps=block? +String(block.reps).split('-').pop().replace(/[^0-9]/g,'')||12 : 12;
  const hitTop=done.every(s=>(+s.r||0)>=topReps);
  const inc = ex.load==='db'?2:(ex.load==='cable'?2.5:2.5);
  const S1=(v)=> ex.load==='db'? snapDb(v):v;

  if(hitTop && avgRIR>=1.5){ const nw= ex.load==='db'? (DB_WEIGHTS[DB_WEIGHTS.indexOf(snapDb(maxW))+1]||snapDb(maxW)) : maxW+inc; return {lo:nw, hi:nw, why: ex.load==='db'? 'زد لدرجة الدمبل التالية المتوفرة (درجات Technogym: 1-10 كجم ثم قفزات 2 كجم)':'وصلت أعلى النطاق بسهولة — زد درجة واحدة (~'+inc+' كجم حسب درجات الجهاز)'}; }
  return {lo:S1(maxW), hi:S1(maxW), why:'استمر بنفس الوزن وزد التكرارات داخل النطاق'};
}
function findBlock(exId){
  for(const k in WORKOUTS){ const b=(WORKOUTS[k].blocks||[]).find(x=>x.ex===exId); if(b) return b; }
  return null;
}

function saveDaily(dateStr){
  const w=parseFloat(document.getElementById('wIn').value);
  const st=parseInt(document.getElementById('stIn').value);
  if(w&&w>30&&w<250){ const ex=S.weights.find(x=>x.date===dateStr); if(ex) ex.kg=w; else S.weights.push({date:dateStr,kg:w}); S.weights.sort((a,b)=>a.date<b.date?-1:1); }
  if(st&&st>0) S.stepsLog[dateStr]=st;
  save(true); renderToday();
}

function markMeal(i,key,st){

function swapMeal(i,key,curId){
  const cur=MENU[curId];

    const m=MENU[k];
    if(k===curId) return false;
    if(cur.cat==='carb'||cur.cat==='lowcarb') return m.cat==='carb'||m.cat==='lowcarb';
    if(cur.cat==='chicken'||cur.cat==='beef'||cur.cat==='seafood') return ['chicken','beef'].includes(m.cat); /* بدون بحري حسب طلبك */
    return m.cat===cur.cat;
  });
  let h=`<h3>بدّل «${esc(cur.ar)}» بصنف من نفس الفئة</h3><div style="max-height:50vh;overflow:auto">`;
  alts.forEach(k=>{ const m=MENU[k];
    h+=`<div class="meal" style="cursor:pointer" onclick="applySwap(${i},'${key}','${k}')"><b>${esc(m.ar)}</b>

  h+=`</div><div class="btnrow"><button class="btn" onclick="dlg.close()">إغلاق</button></div>`;
  openDlg(h);

  <div class="note">كل يوم: وجبة دجاج + وجبة لحم (بدون بحري) بأوزان مكتوبة بالجرام — اطلب من المطعم بالوزن المذكور حرفياً. الصوص على جنب، وبدائل اللو كارب بدل الأرز في أيام الراحة. الوجبات مثبتة على التاريخ حتى لو أجّلت تمريناً. عدّل أي صنف بزر «بدّل».</div>
  <div class="wkband" style="margin-top:8px">`;
  for(let c=0;c<=lastCal;c++){
    const ds=calDate(c); const res=resolveCal(c);
    const isT=res.kind==='day'&&PLAN[res.i].isTrain&&!isCancelled(res.i);

    html+=`<button class="dayb ${c===ti?'today':''} ${c===selectedMealDay?'selected':''}" onclick="selectedMealDay=${c};renderMeals()">
    <small>${dn}</small><b>${ds.slice(8)}</b><span class="st">${isT?'تمرين':'راحة'}</span></button>`;
  }
  html+='</div></div>';
  const c=Math.min(selectedMealDay,lastCal); const meals=mealsForCal(c); const t=targets();
  const res=resolveCal(c); const isT=res.kind==='day'&&PLAN[res.i].isTrain&&!isCancelled(res.i);
  const ds=calDate(c); const dn=DAY_AR[new Date(ds+'T00:00:00').getDay()];
  const core=dayMealTotals(meals,false), full=dayMealTotals(meals,true);
  html+=`<div class="card"><h2>${dn} ${fmtDateAr(ds)} ${isT?'<span class="chip dark">تدريب</span>':'<span class="chip">راحة</span>'}</h2>
  <div class="grid4" style="margin-top:6px">
    <div class="tile"><div class="v">${r0(core.kcal)}</div><div class="l">أساسي kcal</div></div>
    <div class="tile"><div class="v">${r0(full.kcal)}</div><div class="l">مع سناك الجوع</div></div>
    <div class="tile"><div class="v">${r0(full.p)}</div><div class="l">بروتين غ</div></div>
    <div class="tile"><div class="v">${isT?t.kcalTrain:t.kcalRest}</div><div class="l">الهدف kcal</div></div>
  </div>
  ${mealsChecklistHTML(c,{meals:meals},dayMealLog(c),false)}
  <div class="note">💡 ${esc(meals.why)}</div></div>`;
  /* دليل الأصناف الكامل */
  html+=`<div class="card"><h2>📖 دليل المنيو الكامل</h2><div class="sub">كل الأصناف المتاحة للتبديل (الأسعار بالريال، القيم كما في المنيو)</div>`;
  ['chicken','beef','seafood','pasta','burger','wrap','salad','snack','drink','carb','lowcarb','sauce'].forEach(cat=>{
    const items=Object.keys(MENU).filter(k=>MENU[k].cat===cat);
    if(!items.length) return;
    html+=`<h3 style="margin-top:12px">${CAT_AR[cat]}${cat==='seafood'?' <span class="chip warn">خارج خطتك — بدون بحري بطلبك</span>':''}</h3><table class="mini"><tr><th>الصنف</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th>ر.س</th></tr>`;
    items.forEach(k=>{ const m=MENU[k];
      html+=`<tr><td>${esc(m.ar)}${m.lc?' <span class="chip ok">لو كارب</span>':''}${m.best?' ⭐':''}</td><td class="num">${m.kcal}</td><td class="num">${m.p}</td><td class="num">${m.c}</td><td class="num">${m.f}</td><td class="num">${m.price||'—'}</td></tr>`; });
    html+='</table>';
  });
  html+=`<div class="note">القيم من بطاقات المنيو الرسمية (سُحبت في 01/08/2026). وجبات الدجاج/اللحم/البحري قيمها «للمصدر البروتيني فقط» — أضف جانب الكارب. إذا تغير المنيو أرسل لي النسخة الجديدة وسأحدث الخطة دون فقدان سجلاتك.</div></div>`;
  document.getElementById('v-meals').innerHTML=html;
}

function renderLib(){

  <div class="sub">الأسماء بصيغة «الخط + الوظيفة» لأن موديلات ناديك لم تُؤكد بعد — أرسل صور الأجهزة وسأطابقها بدقة. روابط الفيديو تفتح بحث يوتيوب بالاسم الدقيق للجهاز والتمرين.</div></div>`;

  'ترايسبس':['pushdown','overheadExt','armExtM','dipsMachine'],'أرجل ومؤخرة':['legPress','legExt','legCurl','calfRaise','hipAbd','gluteKickback'],

<script>
/* ===================== WORKOUT SESSION ENGINE ===================== */
let SES=null, sesTick=null;
let audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); }
function beep(){
  if(!S.settings.sound) return; ensureAudio(); if(!audioCtx) return;
  try{
    const now=audioCtx.currentTime;
    [0,0.25,0.5].forEach((t,ix)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value= ix===2? 1180:880; o.type='sine';
      g.gain.setValueAtTime(0.0001,now+t); g.gain.exponentialRampToValueAtTime(0.35,now+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+t+0.22);
      o.start(now+t); o.stop(now+t+0.24);
    });
  }catch(e){}
}
function buzz(){ if(S.settings.vibrate && navigator.vibrate){ try{navigator.vibrate([250,120,250]);}catch(e){} } }

function openWorkoutEntry(){
  ensureAudio();
  if(S.sessionActive){ SES=S.sessionActive; showSession(); return; }
  const c=todayCal(); const res=resolveCal(c);
  if(res.kind==='day' && PLAN[res.i].isTrain && !isCancelled(res.i)){ startSession(res.i); return; }
  /* يوم راحة/مؤجل: اختر يوم تمرين */
  let h=`<h3>${res.kind==='gap'?'اليوم راحة (يوم مؤجل) ⏭':'اليوم يوم راحة 🛌'}</h3><p class="sub">تبي تفتح تمريناً من يوم آخر؟</p>`;
  const anchor=res.kind==='gap'? res.next : res.i;
  PLAN.forEach(x=>{ const j=x.idx-1;
    if(x.isTrain && !isCancelled(j) && Math.abs(j-anchor)<=7){ const ed=effDate(j);
      h+=`<button class="btn" style="margin:3px" onclick="dlg.close();startSession(${j})">${ed.slice(8,10)}/${ed.slice(5,7)} — ${esc(WORKOUTS[x.workout].title)}</button>`; }
  });
  h+=`<div class="btnrow"><button class="btn ghost" onclick="dlg.close()">إغلاق</button></div>`;
  openDlg(h);
}
function startSession(dayI){
  ensureAudio();
  const d=planDay(dayI); if(!d.isTrain){ toast('هذا يوم راحة'); return; }
  const lg=dayWorkLog(dayI);
  SES={ dayI, wk:d.workout, exI:0, setI:0, startTs:Date.now(), pausedAt:null, pausedAccum:0,
        restEndTs:null, restTotal:0, phase:'work', cardio:false, replaced:lg.replaced||{} };
  S.sessionActive=SES; save(false);
  showSession();
}
function sesBlocks(){ return WORKOUTS[SES.wk].blocks; }
function curBlock(){ return sesBlocks()[SES.exI]; }
function blkSets(bx){ const b=sesBlocks()[bx]; return b.sets + compExtra(SES.dayI, bx, b.ex); }
function sesElapsed(){
  const base=(SES.pausedAt||Date.now())-SES.startTs-SES.pausedAccum;
  return Math.max(0,Math.floor(base/1000));
}
function fmtMMSS(s){ const m=Math.floor(s/60), x=s%60; return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }

function showSession(){
  document.getElementById('sessionOverlay').classList.add('on');
  document.body.style.overflow='hidden';
  clearInterval(sesTick); sesTick=setInterval(sessionTickRender,1000);
  sessionRender();
}
function hideSession(){
  document.getElementById('sessionOverlay').classList.remove('on');
  document.body.style.overflow='';
  clearInterval(sesTick); sesTick=null;
  render();
}
function sessionTickRender(){
  if(!SES) return;
  const tEl=document.getElementById('sesTime'); if(tEl) tEl.textContent=fmtMMSS(sesElapsed());
  if(SES.phase==='rest' && !SES.pausedAt){
    const left=Math.ceil((SES.restEndTs-Date.now())/1000);
    const rEl=document.getElementById('restLeft');
    if(rEl) rEl.textContent=fmtMMSS(Math.max(0,left));
    const pb=document.getElementById('restBar');
    if(pb) pb.style.width=Math.max(0,Math.min(100,100*left/SES.restTotal))+'%';
    if(left<=0){ SES.phase='work'; SES.restEndTs=null; beep(); buzz(); queueSave(); sessionRender(true); }
  }
}
function sessionRender(restJustEnded){
  if(!SES) return;
  const d=planDay(SES.dayI), w=WORKOUTS[SES.wk], blocks=sesBlocks();
  const lg=dayWorkLog(SES.dayI);
  const total=blocks.reduce((a,b,ix)=>a+blkSets(ix),0);
  const doneSets=Object.values(lg.sets).flat().filter(s=>s&&!s.skip).length;
  let h=`<div class="shead">
    <div><span class="en-tag" style="color:#8b9097">${esc(w.en)}</span><h3 style="margin:0;color:#fff">${esc(w.title)}</h3>
    <div class="sub" style="color:#9aa0a8">${d.dayName} — يوم ${d.idx} • RIR ${d.phase.rir}</div></div>
    <div style="text-align:left"><div class="stime" id="sesTime">${fmtMMSS(sesElapsed())}</div>
    <div class="btnrow" style="margin:4px 0 0">
      <button class="btn small sbtn" onclick="togglePause()">${SES.pausedAt?'▶️ استئناف':'⏸️ إيقاف'}</button>
      <button class="btn small sbtn" onclick="confirmEnd()">⏹️ إنهاء</button>
    </div></div></div>
  <div class="progressbar g" style="margin:10px 0 2px"><i style="width:${r0(100*doneSets/total)}%"></i></div>
  <div class="sub" style="color:#9aa0a8">${doneSets} من ${total} سيت</div>`;

  if(SES.pausedAt){
    h+=`<div class="scard center"><h3>⏸️ الجلسة موقوفة</h3><p class="sub" style="color:#aeb2b8">المؤقت متوقف — كمل وقت ما تكون جاهز.</p>
    <button class="btn sbtn primary big" onclick="togglePause()">استئناف التمرين</button></div>`;
    document.getElementById('sessionOverlay').innerHTML=h; return;
  }

  if(SES.cardio){
    const c=EX[w.cardio.ex];
    h+=`<div class="scard"><h3>🫀 الكارديو الختامي: ${esc(c.ar)} — ${w.cardio.min} دقيقة</h3>
    <div class="sub" style="color:#aeb2b8">${esc(w.cardio.note)} • ${esc(c.tg)}</div>
    <ul style="color:#c8ccd2">${c.setup.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
    <div class="btnrow">
      <button class="btn sbtn primary" onclick="dayWorkLog(SES.dayI).cardioDone=true;finishSession()">✓ خلصت الكارديو — أنهِ الجلسة</button>
      <button class="btn sbtn" onclick="finishSession()">تخطَّ الكارديو وأنهِ</button>
    </div></div>`;
    document.getElementById('sessionOverlay').innerHTML=h; return;
  }

  const b=curBlock(); const ex=EX[b.ex]; const sg=suggestLoad(b.ex,SES.dayI);
  const sets=lg.sets[b.ex]||[];
  const replaced=SES.replaced[b.ex];
  h+=`<div class="scard ${SES.phase==='rest'?'resting':''} ${restJustEnded?'restdone':''}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <div><h3 style="margin:0">${esc(ex.ar)} ${replaced?`<span class="chip warn">بديل: ${esc(replaced)}</span>`:''}</h3>
      <div class="sub" style="color:#aeb2b8">${esc(ex.tg)} • تمرين ${SES.exI+1}/${blocks.length}</div></div>
      <span class="tg">TG</span></div>
    <div class="setdots">${Array.from({length:blkSets(SES.exI)},(_,k)=>`<i class="${sets[k]&&!sets[k].skip?'d':''} ${k===SES.setI?'cur':''}"></i>`).join('')}</div>`;

  if(SES.phase==='rest'){
    const left=Math.max(0,Math.ceil((SES.restEndTs-Date.now())/1000));
    h+=`<div class="center"><div class="sub" style="color:#c8f135;font-weight:800">استراحة — السيت القادم: ${SES.setI+1} من ${blkSets(SES.exI)}</div>
    <div class="bigtimer" id="restLeft">${fmtMMSS(left)}</div>
    <div class="progressbar" style="background:rgba(255,255,255,.12)"><i id="restBar" style="background:#c8f135;width:${r0(100*left/SES.restTotal)}%"></i></div>
    <div class="btnrow" style="justify-content:center">
      <button class="btn sbtn" onclick="adjRest(-15)">−15ث</button>
      <button class="btn sbtn" onclick="adjRest(15)">+15ث</button>
      <button class="btn sbtn primary" onclick="skipRest()">تخطَّ الاستراحة ←</button>
    </div></div>`;
  } else {
    h+=`<div class="sub" style="color:#c8ccd2;margin-top:4px">السيت <b class="snum">${SES.setI+1}</b> من <b class="snum">${blkSets(SES.exI)}</b> • الهدف <b class="snum">${b.reps}</b> تكرار • راحة ${b.rest}ث • احتياطي RIR ${d.phase.rir}</div>
    ${sg?`<div class="sub" style="color:#c8f135;margin-top:2px">وزن مقترح: <b class="snum">${sg.lo===sg.hi?sg.lo:sg.lo+'–'+sg.hi} كجم</b> — ${esc(sg.why)}</div>`:''}
    <div class="sgrid" style="margin-top:10px">
      <div><label class="f">الوزن الفعلي (كجم)</label><input type="number" step="0.5" inputmode="decimal" id="inW" value="${sets[SES.setI]?.w ?? (sg? sg.lo:'')}"></div>
      <div><label class="f">التكرارات الفعلية</label><input type="number" inputmode="numeric" id="inR" value="${sets[SES.setI]?.r ?? ''}" placeholder="${b.reps}"></div>
      <div><label class="f">RIR (احتياطي)</label><input type="number" inputmode="numeric" id="inRIR" value="${sets[SES.setI]?.rir ?? ''}" placeholder="${d.phase.rir}"></div>
    </div>
    <div class="btnrow" style="align-items:center">
      <label style="display:flex;align-items:center;gap:6px;color:#c8ccd2;font-size:13px"><input type="checkbox" id="inPain" style="width:18px;height:18px" ${sets[SES.setI]?.pain?'checked':''}> ألم/انزعاج</label>
      <input type="text" id="inNote" placeholder="ملاحظة (اختياري)" style="flex:1;min-width:120px" value="${esc(sets[SES.setI]?.note||'')}">
    </div>
    <div class="btnrow">
      <button class="btn sbtn primary big" onclick="completeSet()">✓ أنهيت السيت — ابدأ الاستراحة</button>
    </div>
    <div class="btnrow">
      <button class="btn small sbtn" onclick="skipExercise()">تخطَّ التمرين</button>
      <button class="btn small sbtn" onclick="replaceExercise()">🔁 بدّل التمرين (الجهاز مشغول)</button>
      <button class="btn small sbtn" onclick="showExInfo('${b.ex}')">ℹ️ طريقة الأداء</button>
    </div>`;
  }
  h+=`</div>`;
  /* قائمة بقية التمارين */
  h+=`<div class="scard"><div class="sub" style="color:#9aa0a8;font-weight:800">بقية الجلسة</div>`;
  blocks.forEach((bb,ix)=>{
    const exx=EX[bb.ex]; const st=lg.sets[bb.ex]||[]; const dn=st.filter(s=>s&&!s.skip).length;
    h+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);${ix===SES.exI?'color:#fff;font-weight:800':'color:#8b9097'}">
    <span>${ix===SES.exI?'▸ ':''}${esc(exx.ar)}</span><span class="snum">${dn}/${blkSets(ix)}</span></div>`;
  });
  h+=`<div style="display:flex;justify-content:space-between;padding:6px 0;color:#8b9097"><span>🫀 ${esc(EX[w.cardio.ex].ar)}</span><span class="snum">${w.cardio.min}د</span></div></div>`;
  h+=`<div class="sub center" style="color:#5f646b;margin-top:4px">الصوت ${S.settings.sound?'مفعل':'مطفأ'} • الاهتزاز ${S.settings.vibrate?'مفعل':'مطفأ'} — من الإعدادات</div>`;
  document.getElementById('sessionOverlay').innerHTML=h;
}
function showExInfo(exId){
  const ex=EX[exId];
  openDlg(`<h3>${esc(ex.ar)}</h3>${exDetailHTML(exId)}<div class="btnrow"><button class="btn" onclick="dlg.close()">رجوع للتمرين</button></div>`);
}
function completeSet(){
  const b=curBlock(); const lg=dayWorkLog(SES.dayI);
  if(!lg.sets[b.ex]) lg.sets[b.ex]=[];
  const w=parseFloat(document.getElementById('inW').value);
  const r=parseInt(document.getElementById('inR').value);
  const rir=document.getElementById('inRIR').value===''?null:parseInt(document.getElementById('inRIR').value);
  const pain=document.getElementById('inPain').checked;
  const note=document.getElementById('inNote').value.trim();
  lg.sets[b.ex][SES.setI]={w:isNaN(w)?null:w, r:isNaN(r)?null:r, rir, pain, note, skip:false};
  if(pain) toast('سُجل الألم — إذا كان حاداً أوقف التمرين وبدّله');
  const lastSetOfEx=SES.setI>=blkSets(SES.exI)-1;
  const lastEx=SES.exI>=sesBlocks().length-1;
  if(lastSetOfEx && lastEx){ SES.cardio=true; queueSave(); sessionRender(); return; }
  if(lastSetOfEx){ SES.exI++; SES.setI=0; } else { SES.setI++; }
  SES.phase='rest'; SES.restTotal=b.rest; SES.restEndTs=Date.now()+b.rest*1000;
  queueSave(); sessionRender();
}
function adjRest(dsec){ if(SES.phase!=='rest') return; SES.restEndTs+=dsec*1000; SES.restTotal=Math.max(15,SES.restTotal+dsec); queueSave(); sessionRender(); }
function skipRest(){ SES.phase='work'; SES.restEndTs=null; queueSave(); sessionRender(); }
function skipExercise(){
  const b=curBlock(); const lg=dayWorkLog(SES.dayI);
  if(!lg.sets[b.ex]) lg.sets[b.ex]=[];
  for(let k=SES.setI;k<blkSets(SES.exI);k++){ if(!lg.sets[b.ex][k]) lg.sets[b.ex][k]={skip:true}; }
  if(SES.exI>=sesBlocks().length-1){ SES.cardio=true; } else { SES.exI++; SES.setI=0; SES.phase='work'; }
  queueSave(); sessionRender();
}
function replaceExercise(){
  const b=curBlock(); const ex=EX[b.ex];
  openDlg(`<h3>بدّل «${esc(ex.ar)}»</h3><p class="sub">البديل المقترح: <b>${esc(ex.alt)}</b> — بنفس السيتات والتكرارات.</p>
  <div class="btnrow">
    <button class="btn primary" onclick="SES.replaced['${b.ex}']=EX['${b.ex}'].alt;dayWorkLog(SES.dayI).replaced['${b.ex}']=EX['${b.ex}'].alt;dlg.close();queueSave();sessionRender();toast('استخدم البديل وسجل عليه')">استخدم البديل</button>
    <button class="btn ghost" onclick="dlg.close()">إلغاء</button>
  </div>`);
}
function togglePause(){
  if(SES.pausedAt){ const pd=Date.now()-SES.pausedAt; SES.pausedAccum+=pd; if(SES.restEndTs) SES.restEndTs+=pd; SES.pausedAt=null; }
  else SES.pausedAt=Date.now();
  queueSave(); sessionRender();
}
function confirmEnd(){
  openDlg(`<h3>إنهاء الجلسة؟</h3><p class="sub">ستُحفظ كل السيتات المسجلة.</p>
  <div class="btnrow"><button class="btn primary" onclick="dlg.close();finishSession()">أنهِ واحفظ</button>
  <button class="btn ghost" onclick="dlg.close()">استمرار التمرين</button></div>`);
}
function finishSession(){
  const lg=dayWorkLog(SES.dayI); const w=WORKOUTS[SES.wk]; const blocks=sesBlocks();
  const dur=sesElapsed(); lg.durationSec=dur;
  const total=blocks.reduce((a,b,ix)=>a+blkSets(ix),0);
  const doneSets=Object.values(lg.sets).flat().filter(s=>s&&!s.skip).length;
  lg.status = doneSets>=total*0.6 ? 'done':'partial';
  let vol=0; blocks.forEach(b=>{ (lg.sets[b.ex]||[]).forEach(s=>{ if(s&&!s.skip&&s.w&&s.r) vol+=s.w*s.r; }); });
  let sug='';
  blocks.forEach(b=>{ const sgN=suggestLoad(b.ex, SES.dayI+1); if(sgN) sug+=`<tr><td>${esc(EX[b.ex].ar)}</td><td class="num">${sgN.lo===sgN.hi?sgN.lo:sgN.lo+'–'+sgN.hi}</td></tr>`; });
  const h=`<h3>✅ ملخص الجلسة — ${esc(w.title)}</h3>
  <div class="grid3" style="margin:8px 0">
    <div class="tile"><div class="v">${fmtMMSS(dur)}</div><div class="l">المدة</div></div>

    <div class="tile"><div class="v">${r0(vol).toLocaleString('en')}</div><div class="l">حجم كجم×تكرار</div></div>

  <h3 style="margin-top:10px">مقترح الجلسة القادمة</h3>

<script>
/* ===================== MORE: progress / check-in / settings / sources ===================== */
function renderMore(){
  const el=document.getElementById('moreBody');
  document.querySelectorAll('#v-more [data-go]').forEach(b=>b.onclick=()=>{moreSub=b.dataset.go;renderMore();});
  if(moreSub==='progress') el.innerHTML=progressHTML();
  else if(moreSub==='checkin') el.innerHTML=checkinHTML();
  else if(moreSub==='settings') el.innerHTML=settingsHTML();
  else if(moreSub==='sources') el.innerHTML=sourcesHTML();
  else el.innerHTML=`<div class="card"><div class="sub">اختر قسماً من الأعلى. بياناتك كلها محفوظة محلياً على جهازك فقط.</div></div>`;
}

/* ---------- SVG line chart ---------- */
function lineChart(data, unit, color){
  if(!data.length) return `<div class="sub center" style="padding:18px">لا توجد بيانات بعد — سجل أول قياس من شاشة اليوم.</div>`;
  const W=560,H=150,P=28;
  const ys=data.map(d=>d.y);
  let mn=Math.min(...ys), mx=Math.max(...ys); if(mx-mn<1){mx+=0.5;mn-=0.5;}
  const X=i=>P+(W-2*P)*(data.length===1?0.5:i/(data.length-1));
  const Y=v=>H-P-(H-2*P)*((v-mn)/(mx-mn));
  const pts=data.map((d,i)=>X(i)+','+Y(d.y)).join(' ');
  let dots=data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.y)}" r="3.5" fill="${color}"/>`).join('');
  let labels=data.map((d,i)=> (data.length<=10||i%Math.ceil(data.length/8)===0)? `<text x="${X(i)}" y="${H-6}" font-size="9" text-anchor="middle" fill="#89907f">${d.x}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <text x="4" y="${Y(mx)+4}" font-size="10" fill="#89907f">${r1(mx)}</text>
    <text x="4" y="${Y(mn)+4}" font-size="10" fill="#89907f">${r1(mn)}</text>
    <line x1="${P}" y1="${Y(mn)}" x2="${W-P}" y2="${Y(mn)}" stroke="#2a2e26"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labels}
    <text x="${W-4}" y="12" font-size="10" text-anchor="end" fill="#89907f">${unit}</text>
  </svg>`;
}
function weekAvgWeights(){
  const out=[];
  for(let w=1;w<=4;w++){
    const days=PLAN.filter(d=>d.week===w).map(d=>d.date);
    const ws=S.weights.filter(x=>days.includes(x.date)).map(x=>x.kg);
    if(ws.length) out.push({week:w, avg:r1(ws.reduce((a,b)=>a+b,0)/ws.length), n:ws.length});
  }
  return out;
}
function weekAdherence(w){
  const days=PLAN.filter(d=>d.week===w);
  let train=0, trainDone=0, mealSlots=0, mealDone=0;
  days.forEach(d=>{
    const i=d.idx-1;
    if(d.isTrain){ train++; if(S.workLogs[i]&&S.workLogs[i].status==='done') trainDone++; }
    const ml=S.mealLogs[i]||{};
    SLOT_ORDER.forEach(s=>{ (d.meals.slots[s]||[]).forEach((mi,ix)=>{ if(s==='x')return; mealSlots++; const st=ml[s+'_'+ix]; if(st==='done'||st==='swapped') mealDone++; }); });
  });
  return {train, trainDone, mealPct: mealSlots? r0(100*mealDone/mealSlots):0};
}
function progressHTML(){
  const wa=weekAvgWeights();
  const wData=S.weights.map(x=>({x:x.date.slice(8,10)+'/'+x.date.slice(5,7), y:x.kg}));
  const waistData=S.waists.map(x=>({x:x.date.slice(8,10)+'/'+x.date.slice(5,7), y:x.cm}));
  const bfData=S.bodyFats.map(x=>({x:x.date.slice(8,10)+'/'+x.date.slice(5,7), y:x.pct}));
  let h=`<div class="card"><h2>📈 التقدم</h2>
  <h3>وزن الجسم (كجم)</h3><div class="chartbox">${lineChart(wData,'kg','#c8f135')}</div>
  ${wa.length?`<div class="grid4" style="margin-top:8px">${wa.map(x=>`<div class="tile"><div class="v">${x.avg}</div><div class="l">متوسط أسبوع ${x.week} (${x.n} قياس)</div></div>`).join('')}</div>`:''}
  <div class="note">قِس صباحاً بعد الحمام وقبل الأكل. احكم على الاتجاه بمتوسط الأسبوع، وتجاهل تذبذب اليوم الواحد.</div>
  <h3 style="margin-top:14px">محيط الخصر (سم)</h3><div class="chartbox">${lineChart(waistData,'cm','#ffb454')}</div>
  <div class="inrow" style="margin-top:8px">
    <div><label class="f">قياس خصر جديد (سم)</label><input type="number" step="0.5" id="waistIn" placeholder="عند السرة"></div>
    <div><label class="f">نسبة دهون (من InBody عند إعادة الفحص)</label><input type="number" step="0.1" id="bfIn" placeholder="%"></div>
  </div>
  <div class="btnrow"><button class="btn primary" onclick="addMeasure()">إضافة القياسات</button></div>
  ${bfData.length?`<h3 style="margin-top:14px">نسبة الدهون %</h3><div class="chartbox">${lineChart(bfData,'%','#7dd3fc')}</div>`:''}
  <h3 style="margin-top:14px">الالتزام الأسبوعي</h3>`;
  for(let w=1;w<=4;w++){ const a=weekAdherence(w);
    const cN=PLAN.filter(d=>d.week===w&&isCancelled(d.idx-1)).length;
    h+=`<div style="margin:8px 0"><b class="sub" style="color:var(--ink)">أسبوع ${w}</b>
    <div class="sub">تمارين: ${a.trainDone}/${a.train} مكتملة${cN?` (منها ${cN} ملغى بتعويض)`:''} • وجبات: ${a.mealPct}%</div>
    <div class="progressbar g"><i style="width:${a.train? r0(100*a.trainDone/a.train):0}%"></i></div></div>`; }
  h+=`</div>`;
  return h;
}
function addMeasure(){
  const today=new Date().toISOString().slice(0,10);
  const wv=parseFloat(document.getElementById('waistIn').value);
  const bf=parseFloat(document.getElementById('bfIn').value);
  if(wv&&wv>40&&wv<200){ S.waists.push({date:today,cm:wv}); S.waists.sort((a,b)=>a.date<b.date?-1:1); }
  if(bf&&bf>3&&bf<60){ S.bodyFats.push({date:today,pct:bf}); S.bodyFats.sort((a,b)=>a.date<b.date?-1:1); }
  save(true); renderMore();
}

/* ---------- Check-in ---------- */
function checkinHTML(){
  const wa=weekAvgWeights();
  let h=`<div class="card"><h2>📝 التشيك-إن الأسبوعي</h2>
  <div class="sub">عبئه نهاية كل أسبوع (الجمعة أو السبت). التوصيات تُبنى على متوسطات الأسبوع كاملاً، لا على يوم واحد.</div>
  <label class="f">الأسبوع</label><select id="ciWeek">${[1,2,3,4].map(w=>`<option value="${w}">أسبوع ${w}</option>`).join('')}</select>
  <div class="inrow">
    <div><label class="f">متوسط وزن الصباح (كجم)</label><input type="number" step="0.1" id="ciW" placeholder="${wa.length? 'آخر متوسط: '+wa[wa.length-1].avg:'—'}"></div>
    <div><label class="f">الخصر (سم)</label><input type="number" step="0.5" id="ciWaist"></div>
  </div>
  <div class="inrow3">
    <div><label class="f">الجوع (1-5)</label><select id="ciHunger">${[1,2,3,4,5].map(x=>`<option ${x===3?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label class="f">الطاقة (1-5)</label><select id="ciEnergy">${[1,2,3,4,5].map(x=>`<option ${x===3?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label class="f">النوم (1-5)</label><select id="ciSleep">${[1,2,3,4,5].map(x=>`<option ${x===3?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>
  <label class="f">ألم أو مشكلة استشفاء؟</label><input type="text" id="ciPain" placeholder="مثال: انزعاج بسيط في المرفق مع البريتشر">
  <label class="f">ملاحظات</label><input type="text" id="ciNotes">
  <div class="btnrow"><button class="btn primary big" onclick="runCheckin()">حلّل الأسبوع وأعطني التوصيات</button></div></div>`;
  S.checkins.slice().reverse().forEach(c=>{
    h+=`<div class="card flat"><h3>نتيجة أسبوع ${c.week} <span class="sub">(${fmtTime(c.date)})</span></h3>
    <div class="sub">متوسط الوزن: ${c.avgW||'—'} كجم • تمارين ${c.done} • التزام وجبات ${c.adherence}% • جوع ${c.hunger} • طاقة ${c.energy} • نوم ${c.sleep}</div>
    <div class="note" style="white-space:pre-line">${esc(c.reco)}</div></div>`;
  });
  return h;
}
function runCheckin(){
  const week=+document.getElementById('ciWeek').value;
  const a=weekAdherence(week);
  const avgW=parseFloat(document.getElementById('ciW').value)||null;
  const waist=parseFloat(document.getElementById('ciWaist').value)||null;
  const hunger=+document.getElementById('ciHunger').value, energy=+document.getElementById('ciEnergy').value, sleep=+document.getElementById('ciSleep').value;
  const pain=document.getElementById('ciPain').value.trim(), notes=document.getElementById('ciNotes').value.trim();
  if(waist){ S.waists.push({date:new Date().toISOString().slice(0,10),cm:waist}); }
  const prev=S.checkins.filter(c=>c.week===week-1).pop();
  const prevW=prev?prev.avgW:(S.profile.weightKg||null);
  let lines=[];
  let lossPct=null;
  if(avgW&&prevW){ lossPct=r1(100*(prevW-avgW)/prevW); lines.push(`التغير الأسبوعي: ${lossPct>0?'-':'+'}${Math.abs(lossPct)}% (${r1(prevW-avgW)} كجم).`); }
  if(a.mealPct<75 || a.trainDone<a.train-1){
    lines.push('الأولوية القادمة: الالتزام قبل أي تعديل — ثبّت الخطة كما هي وحقق ≥80% أسبوعاً كاملاً.');
  } else if(lossPct!=null){
    if(lossPct>1.2 && (hunger>=4||energy<=2)) lines.push('النزول أسرع من اللازم مع جوع/إرهاق: أضف سناك الجوع يومياً (+150-200 kcal) وراقب أسبوعاً.');
    else if(lossPct>=0.4) lines.push('معدل النزول ممتاز (0.4-1.2%): لا تغيّر شيئاً — كرر نفس الأسبوع.');
    else if(week>=2) lines.push('النزول أبطأ من الهدف مع التزام جيد: احذف «سناك الجوع» في أيام الراحة أو ارفع الخطوات إلى 11 ألفاً — خياراً واحداً فقط، ليس الاثنين.');
    else lines.push('أسبوع أول: لا تستعجل الحكم — الماء والجلايكوجين يخفيان النتيجة. استمر.');
  }
  if(hunger>=4&&lossPct!=null&&lossPct<=1.2) lines.push('لإدارة الجوع: قدّم العشاء، أضف سلطة خضراء/فت زيرو (سعرات شبه صفرية)، ونم مبكراً.');
  if(energy<=2||sleep<=2) lines.push('طاقة/نوم منخفض: ثبّت موعد النوم (7-8 ساعات)، وخفف الكارديو الختامي إلى 10 دقائق هذا الأسبوع.'+(week===4?' فعّل الديلود: احذف السيت الأخير من تمارين العزل.':''));
  if(pain) lines.push('الألم ('+pain+'): بدّل التمرين المسبب بالبديل المذكور وخفف وزنه 10-15%. إذا استمر أسبوعين أو كان حاداً/مفصلياً راجع أخصائي علاج طبيعي.');
  if(waist) lines.push('الخصر مسجل — راقب الاتجاه عبر 2-3 أسابيع مع متوسط الوزن معاً.');
  if(!lines.length) lines.push('استمر على نفس الخطة وسجل بياناتك يومياً.');
  const reco='• '+lines.join('\n• ');
  S.checkins.push({week, avgW, waist, done:a.trainDone+'/'+a.train, adherence:a.mealPct, hunger, energy, sleep, pain, notes, reco, date:new Date().toISOString()});
  save(true); renderMore();
}

function saveProfile(){
  const p=S.profile;
  const g=id=>document.getElementById(id).value;
  const num=(id)=>{const v=parseFloat(g(id)); return isNaN(v)?null:v;};
  p.weightKg=num('pW')||p.weightKg; p.heightCm=num('pH')||p.heightCm; p.age=num('pA')||p.age;
  p.smm=num('pSMM'); p.bfm=num('pBFM'); p.pbf=num('pPBF'); p.bmi=num('pBMI'); p.visceral=num('pVis');
  p.bmr=num('pBMR'); p.inbodyScore=num('pScore'); p.inbodyDate=g('pDate');
  p.activityFactor=parseFloat(g('pAct')); p.deficit=parseInt(g('pDef'));
  if(p.inbodyDate) p.estimated=false;
  if(p.pbf!=null){ S.bodyFats.push({date:p.inbodyDate||new Date().toISOString().slice(0,10), pct:p.pbf}); }
  save(true); renderMore(); toast('أُعيد حساب الأهداف ✓');
}
function exportBackup(){
  const data=JSON.stringify(S,null,1);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='mohanad-fitness-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('نُزلت النسخة الاحتياطية');
}
function importBackup(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d || typeof d!=='object' || d.v!==SCHEMA_V) throw 0;
      const clean=DEFAULT_STATE();
      ['profile','settings','workLogs','mealLogs','stepsLog','cancels','comps'].forEach(k=>{ if(d[k]&&typeof d[k]==='object') clean[k]=d[k]; });
      ['weights','waists','bodyFats','checkins'].forEach(k=>{ if(Array.isArray(d[k])) clean[k]=d[k]; });
      if(Array.isArray(d.dayShift)&&d.dayShift.length===28) clean.dayShift=d.dayShift.map(x=>Math.max(0,parseInt(x)||0));
      clean.onboarded=!!d.onboarded;
      S=clean; save(true); render(); toast('استُعيدت النسخة ✓');
    }catch(e){ toast('ملف غير صالح — تأكد أنه نسخة من هذا التطبيق'); }
  };
  rd.readAsText(f);
}
function confirmReset(){
  openDlg(`<h3>⚠️ مسح كل البيانات؟</h3><p class="sub">سيُحذف كل شيء: السجلات، الأوزان، التشيك-إن، الإعدادات. لا تراجع بعدها. صدّر نسخة احتياطية أولاً.</p>
  <div class="btnrow"><button class="btn danger" onclick="S=DEFAULT_STATE();save(true);dlg.close();showView('today');toast('تم المسح')">نعم، امسح كل شيء</button>
  <button class="btn primary" onclick="dlg.close()">تراجع</button></div>`);
}

/* ---------- Sources ---------- */
function sourcesHTML(){
  const L=(u,t)=>`<a class="ext" target="_blank" rel="noopener noreferrer" href="${u}">${t}</a>`;
  return `<div class="card"><h2>📚 المصادر والمنهجية</h2>

}

/* ---------- Onboarding (شاشة تأكيد InBody) ---------- */
function onboardingHTML(){
  const p=S.profile;
  return `<h3>👋 يا هلا مهند — دقيقة وحدة قبل البداية</h3>
  <p class="sub">هذه القيم المبدئية المستخدمة في الحسابات. عدّل ما تعرفه الآن، وبعد فحص InBody غداً حدّثها من الإعدادات — كل الأهداف تُعاد تلقائياً.</p>
  <div class="inrow3">
    <div><label class="f">الوزن (كجم)</label><input type="number" step="0.1" id="obW" value="${p.weightKg}"></div>
    <div><label class="f">الطول (سم)</label><input type="number" id="obH" value="${p.heightCm}"></div>
    <div><label class="f">العمر</label><input type="number" id="obA" value="${p.age}"></div>
  </div>
  <div class="note">الخطة تبدأ الأحد ${fmtDateAr(PLAN_START)}: تدريب الأحد-الخميس (٥ أيام)، راحة الجمعة والسبت. وجباتك محسوبة بالجرام: كل يوم وجبة دجاج ووجبة لحم (بدون بحري) بالأوزان المكتوبة — المطعم يجهزها بالوزن الذي تطلبه.</div>
  <div class="btnrow"><button class="btn primary big" onclick="finishOnboarding()">اعتمد وابدأ 🚀</button></div>`;
}
function finishOnboarding(){
  const num=id=>{const v=parseFloat(document.getElementById(id).value); return isNaN(v)?null:v;};
  S.profile.weightKg=num('obW')||S.profile.weightKg;
  S.profile.heightCm=num('obH')||S.profile.heightCm;
  S.profile.age=num('obA')||S.profile.age;
  S.onboarded=true; dlg.close(); save(true); render();
}

/* ---------- Init ---------- */
document.getElementById('btnManualSave').onclick=()=>save(true);
if(!storageOK) document.getElementById('storageWarn').style.display='block';
document.addEventListener('click',ensureAudio,{once:true});
showView('today');
if(S.sessionActive){
  openDlg(`<h3>🏋️ عندك جلسة تمرين مفتوحة</h3><p class="sub">أُغلقت الصفحة أثناء التمرين — تقدر تكمل من حيث وقفت.</p>
  <div class="btnrow"><button class="btn primary" onclick="dlg.close();SES=S.sessionActive;showSession()">كمّل الجلسة</button>
  <button class="btn ghost" onclick="S.sessionActive=null;queueSave();dlg.close()">تجاهل وأغلقها</button></div>`);
} else if(!S.onboarded){
  openDlg(onboardingHTML());
}
</script>
</body>
</html>
